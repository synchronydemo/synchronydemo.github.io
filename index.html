<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synchrony</title>
<style>
:root{--bg:#000;--fg:#fff;--mid:rgba(255,255,255,.55);--line:rgba(255,255,255,.16);--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background 1.2s var(--ease)}
button{font:inherit;color:inherit;background:none;border:1px solid var(--fg);padding:16px 34px;border-radius:999px;cursor:pointer;transition:background .3s var(--ease),color .3s var(--ease),transform .4s var(--ease),box-shadow .5s var(--ease)}
button:hover,button:focus-visible{background:var(--fg);color:var(--bg);outline:none}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,var(--bg) 0%,#1a1a1a 50%,var(--bg) 100%);transition:background 1.2s var(--ease)}
#bg b{position:absolute;width:75vmax;height:75vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.15),rgba(255,255,255,0));animation:drift 26s ease-in-out infinite alternate}
#bg b:nth-child(1){left:30%;top:-30%}
#bg b:nth-child(2){left:-25%;top:35%;animation-duration:34s;animation-delay:-9s}
#bg b:nth-child(3){left:55%;top:40%;animation-duration:30s;animation-delay:-17s;opacity:.7}
@keyframes drift{to{transform:translate(12vmax,-9vmax) scale(1.15)}}
#pulse{position:absolute;left:-18vmax;top:50%;width:70vmax;height:70vmax;margin-top:-35vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.3),rgba(255,255,255,0));opacity:.25}
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(10px)}}
#login{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
#login>*{animation:rise 1.2s var(--ease) backwards}
#login>:nth-child(2){animation-delay:.1s}
#login>:nth-child(3){animation-delay:.2s}
#login>:nth-child(4){animation-delay:.3s}
#login h1{font-size:clamp(48px,11vw,128px);font-weight:700;letter-spacing:-.05em;line-height:.9}
#login p{color:var(--mid);font-size:16px;max-width:36ch;line-height:1.5}
#join-toggle{color:var(--mid);text-decoration:underline;cursor:pointer;font-size:14px;background:none;border:none;padding:0}
#join-toggle:hover{color:var(--fg)}

/* Party Modal */
#party-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10;align-items:center;justify-content:center;padding:20px}
#party-box{background:#111;border:1px solid var(--line);padding:32px;border-radius:16px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;text-align:center}
#party-box input{background:#000;border:1px solid var(--line);padding:14px;border-radius:8px;color:var(--fg);font-size:18px;text-align:center;outline:none}
#party-box input:focus{border-color:var(--fg)}
.modal-actions{display:flex;gap:10px;justify-content:center}

#app{display:none;position:relative;z-index:1;height:100%;grid-template-columns:minmax(320px,440px) 1fr;gap:clamp(24px,5vw,80px);padding:72px clamp(20px,4vw,56px) 32px}
.brand{position:absolute;top:clamp(20px,3vw,36px);left:clamp(20px,4vw,56px);font-weight:700;letter-spacing:-.03em;font-size:18px;display:flex;gap:16px;align-items:center}
#party-badge{font-size:12px;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer}

#player{display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
#player>*{animation:rise 1.1s var(--ease) backwards}
#player>:nth-child(2){animation-delay:.06s}
#player>:nth-child(3){animation-delay:.12s}
#player>:nth-child(4){animation-delay:.18s}
#player>:nth-child(5){animation-delay:.24s}

.artwrap{position:relative;width:min(100%,max(140px,calc(100dvh - 400px)))}
#glow{position:absolute;inset:-16%;border-radius:50%;background:radial-gradient(closest-side,var(--glow-col,rgba(255,255,255,.6)),rgba(255,255,255,0));opacity:.2;pointer-events:none;animation:breathe 6s ease-in-out infinite alternate;transition:background 1s var(--ease)}
.artwrap.paused #glow{animation-play-state:paused}
@keyframes breathe{to{opacity:.35;transform:scale(1.08)}}

/* Vinyl Styling */
.artbox{position:relative;z-index:1;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle, #1a1a1a 0%, #111 55%, #050505 70%, #000 72%), repeating-radial-gradient(circle, #222, #222 2px, #111 4px, #111 6px);box-shadow:0 20px 40px rgba(0,0,0,.6), inset 0 0 20px rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;animation:spin 4s linear infinite;animation-play-state:paused;transition:transform .6s var(--ease)}
.artbox:not(.paused){animation-play-state:running}
.artbox.paused{transform:scale(.95)}
@keyframes spin{to{transform:rotate(360deg)}}

.vinyl-label{position:absolute;width:38%;height:38%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;background:#000}
.vinyl-label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.spindle{position:absolute;width:10px;height:10px;background:#000;border:2px solid rgba(255,255,255,.3);border-radius:50%;z-index:3}

.meta{min-width:0}
#title{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:var(--mid);margin-top:4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{width:100%}
.bar{position:relative;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline:none}
.trk{position:absolute;left:0;right:0;height:3px;background:var(--line);border-radius:3px;overflow:hidden;transition:height .4s var(--ease)}
.bar:hover .trk,.bar.drag .trk,.bar:focus-visible .trk{height:6px}
#fill{height:100%;background:var(--fg);transform-origin:left;transform:scaleX(0);will-change:transform}
#fill.glide{transition:transform .8s var(--ease)}
#knob{position:absolute;left:0;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;opacity:0;transform:scale(.4);transition:opacity .3s,transform .4s var(--ease)}
.bar:hover #knob,.bar.drag #knob,.bar:focus-visible #knob{opacity:1;transform:scale(1)}
.times{display:flex;justify-content:space-between;color:var(--mid);font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.ctls{display:flex;justify-content:center;align-items:center;gap:22px}
.ctl{padding:0;width:48px;height:48px;border-color:transparent;display:grid;place-items:center}
.ctl svg{display:block}
.ctl.big{position:relative;width:64px;height:64px;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ctl.big:hover{transform:scale(1.08);box-shadow:0 0 44px rgba(255,255,255,.35)}
.ctl.big svg{position:absolute;top:50%;left:50%;margin:-15px 0 0 -15px;transition:opacity .35s var(--ease),transform .7s var(--ease)}
#pp[data-state=playing] .i-play{opacity:0;transform:scale(.3) rotate(-90deg)}
#pp[data-state=paused] .i-pause{opacity:0;transform:scale(.3) rotate(90deg)}
.ctl:active{transform:scale(.92)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--mid);font-size:12px}
.tools button{padding:5px 11px;font-size:12px;border-color:var(--line)}
#off{min-width:54px;text-align:center;font-variant-numeric:tabular-nums}

#lyrics{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#stage{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity,filter}
#stage.plain{overflow-y:auto;scrollbar-width:none;padding:12% 0}
#track{position:absolute;left:0;right:0;top:0;will-change:transform;transition:transform .9s var(--ease)}
#stage.plain #track{position:relative;transform:none!important;transition:none}
.l{font-size:clamp(26px,3.6vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.12;padding:.34em 0;opacity:.2;filter:blur(1.5px);transform:scale(.94) translateX(-6px);transform-origin:left center;transition:opacity .6s var(--ease),filter .6s var(--ease),transform .9s var(--ease);overflow-wrap:anywhere}
.l.n{opacity:.4;filter:blur(.6px)}
.l.a{opacity:1;filter:none;transform:scale(1)}
.l.p{opacity:.5;filter:none;transform:scale(.97)}
#stage.plain .l{font-size:clamp(20px,2.4vw,30px);opacity:.8;filter:none;transform:none;padding:.18em 0}
.tag{color:var(--mid);font-size:14px;margin-bottom:18px}
#note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px;font-size:clamp(22px,3vw,40px);font-weight:700;letter-spacing:-.03em;color:var(--mid);pointer-events:none;transition:opacity .5s var(--ease);z-index:2}
#note button{pointer-events:auto;font-size:14px;font-weight:400;letter-spacing:0;padding:10px 20px}
#idle{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--mid);text-align:center;z-index:3;font-size:18px;padding:24px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:#000;border:1px solid var(--line);padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .5s var(--ease);z-index:5;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:12px;padding:60px 20px 16px}
#player{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px}
.artwrap{width:110px;flex:none}
#glow{inset:-30%}
.meta{flex:1}
#title{font-size:20px}
.prog,.ctls{flex-basis:100%}
.tools{display:none}
#pulse{left:50%;margin-left:-35vmax;top:0;margin-top:-25vmax}
}
@media (prefers-reduced-motion:reduce){#track,.l,.artbox,#bg b,#glow{transition:none;animation:none}}
</style>
</head>
<body>
<div id="bg"><b></b><b></b><b></b><div id="pulse"></div></div>

<div id="login">
<h1>Synchrony</h1>
<p>Live lyrics and playback controls for whatever you’re playing on Spotify.</p>
<button id="connect">Connect Spotify</button>
<button id="join-toggle">Join a party?</button>
</div>

<!-- Party Modal -->
<div id="party-modal">
<div id="party-box">
<h2>Join a Party</h2>
<p style="color:var(--mid);font-size:14px;">Enter the party code displayed on your host's screen.</p>
<input type="text" id="party-code-input" placeholder="e.g. 4892" maxlength="6">
<div class="modal-actions">
<button id="party-cancel" style="padding:10px 20px;">Cancel</button>
<button id="party-join" style="padding:10px 20px;background:var(--fg);color:var(--bg)">Join</button>
</div>
</div>
</div>

<div id="app">
<div class="brand">
  <span>Synchrony</span>
  <div id="party-badge" style="display:none" title="Click to copy party code"></div>
</div>
<section id="player">
<div class="artwrap" id="wrap">
  <div id="glow"></div>
  <div class="artbox paused" id="artbox">
    <div class="vinyl-label">
      <img id="art" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    </div>
    <div class="spindle"></div>
  </div>
</div>
<div class="meta"><div id="title">Nothing playing</div><div id="artist">Press play in Spotify</div></div>
<div class="prog"><div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek"><div class="trk"><div id="fill"></div></div><div id="knob"></div></div><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
<div class="ctls">
<button class="ctl" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
<button class="ctl big" id="pp" data-state="paused" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
<button class="ctl" id="next" aria-label="Next track"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
</div>
<div class="tools"><span>Sync</span><button id="minus" aria-label="Earlier">−50</button><span id="off">0 ms</span><button id="plus" aria-label="Later">+50</button></div>
</section>
<section id="lyrics"><div id="idle">Open Spotify and play a song.</div><div id="note"></div><div id="stage"><div id="track"></div></div></section>
</div>
<div id="toast"></div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const CLIENT_ID="a199a4190b6542aa8ea7605253c9b931";
const REDIRECT=location.origin+location.pathname;
const SCOPE="user-read-currently-playing user-read-playback-state user-modify-playback-state";
const EASE="cubic-bezier(.16,1,.3,1)";
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const rand=n=>b64(crypto.getRandomValues(new Uint8Array(n)));

let isGuest=false,partyCode=null,partyInterval=null;

async function login(){
const verifier=rand(64);
const challenge=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
store.set("sy_v",verifier);
location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,scope:SCOPE,code_challenge_method:"S256",code_challenge:challenge});
}

async function tokenRequest(body){
const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
if(!r.ok)throw new Error("token");
const d=await r.json();
store.set("sy_at",d.access_token);
store.set("sy_exp",String(Date.now()+d.expires_in*1000-30000));
store.set("sy_scope",SCOPE);
if(d.refresh_token)store.set("sy_rt",d.refresh_token);
return d.access_token;
}

async function token(){
if(store.get("sy_scope")!==SCOPE){["sy_at","sy_exp","sy_rt"].forEach(store.del);return null}
const at=store.get("sy_at");
if(at&&Date.now()<Number(store.get("sy_exp")))return at;
const rt=store.get("sy_rt");
if(!rt)return null;
try{return await tokenRequest({grant_type:"refresh_token",refresh_token:rt,client_id:CLIENT_ID})}catch(e){["sy_at","sy_exp","sy_rt"].forEach(store.del);return null}
}

function showApp(){$("login").style.display="none";$("app").style.display="grid"}
function showLogin(){$("app").style.display="none";$("login").style.display="flex"}
let toastT;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3200)}

let offset=Number(store.get("sy_off"))||0;
function setOffset(v){offset=v;store.set("sy_off",String(v));$("off").textContent=(v>0?"+":"")+v+" ms"}
setOffset(offset);
$("minus").onclick=()=>setOffset(offset-50);
$("plus").onclick=()=>setOffset(offset+50);
$("connect").onclick=login;

// Party Modal Handlers
$("join-toggle").onclick=()=>{ $("party-modal").style.display="flex";$("party-code-input").focus(); };
$("party-cancel").onclick=()=>{ $("party-modal").style.display="none"; };
$("party-join").onclick=()=>{
  const code= $("party-code-input").value.trim().toUpperCase();
  if(!code) return toast("Enter a valid party code.");
  isGuest=true;
  partyCode=code;
  store.set("sy_party_guest",code);
  $("party-modal").style.display="none";
  showApp();
  $("party-badge.style.display")="block";
  $("party-badge").textContent="Party: "+code;
  startGuestSync();
  requestAnimationFrame(frame);
};

let cur={id:null,dur:0,playing:false,pos:0,at:0,tr:null};
let lines=[],els=[],active=-2,synced=false,endPolled=false,lastSec=-1,hold=0,seeking=false,seekRatio=0,fxDir=1,inDir=1,fresh=false,stageAnim=null;
const cache=new Map();
const trackEl=$("track"),stage=$("stage"),lyr=$("lyrics"),note=$("note"),bar=$("bar");
let artEl=$("art");
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

function parseLRC(t){
const out=[];
for(const raw of t.split("\n")){
const m=raw.match(/^((?:\[\d+:\d+(?:[.:]\d+)?\])+)\s*(.*)$/);
if(!m)continue;
const text=m[2].trim();
for(const tm of m[1].matchAll(/\[(\d+):(\d+)(?:[.:](\d+))?\]/g)){
const frac=tm[3]?Number("0."+tm[3]):0;
out.push({t:(Number(tm[1])*60+Number(tm[2])+frac)*1000,s:text});
}
}
return out.sort((a,b)=>a.t-b.t);
}

const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim();
const clean=s=>s.replace(/\s*[\(\[][^\)\]]*(feat|ft\.|with|prod|remaster|version|edit|mix|live|mono|stereo|deluxe|explicit|clean)[^\)\]]*[\)\]]/ig,"").replace(/\s+-\s+.*(remaster|version|edit|mix|live|mono|stereo|single|deluxe).*$/i,"").replace(/\s+/g," ").trim()||s;

async function lr(path,params){
const r=await fetch("https://lrclib.net/api/"+path+"?"+new URLSearchParams(params));
if(r.status===404)return null;
if(!r.ok)throw new Error("lrclib");
return r.json();
}

function score(c,tr,cname,dur){
const tn=norm(c.trackName||c.name),an=norm(c.artistName);
const want=[norm(tr.name),norm(cname)];
let s=0;
if(want.includes(tn))s+=50;
else if(tn.length>1&&want.some(w=>w&&(tn.includes(w)||w.includes(tn))))s+=20;
else return -1;
// Lenient artist score for leaks/remixes
if(an&&tr.artists.some(a=>{const n=norm(a.name);return n&&(an.includes(n)||n.includes(an))}))s+=30;
else s+=10; 
if(c.duration){const d=Math.abs(c.duration-dur);if(d>25)return -1;s+=d<=2?30:d<=6?15:0}
if(c.syncedLyrics)s+=10;
else if(c.plainLyrics)s+=2;
return s;
}

async function findLyrics(tr){
const dur=tr.duration_ms/1000,artist=tr.artists[0].name,name=tr.name,cname=clean(name),album=tr.album.name,d=Math.round(dur);
const run=async calls=>{
const res=await Promise.allSettled(calls);
const vals=res.filter(r=>r.status==="fulfilled").map(r=>r.value);
if(!vals.length)throw new Error("net");
return vals.flatMap(v=>Array.isArray(v)?v:v?[v]:[]);
};
const pick=pool=>{let best=null,bs=-1;for(const c of pool){const s=score(c,tr,cname,dur);if(s>bs){bs=s;best=c}}return bs>=0?best:null};
const first=[lr("get",{artist_name:artist,track_name:name,album_name:album,duration:d})];
if(cname!==name)first.push(lr("get",{artist_name:artist,track_name:cname,album_name:album,duration:d}));
first.push(lr("search",{track_name:cname,artist_name:artist}),lr("search",{q:artist+" "+cname}),lr("search",{q:cname}));
let best=pick(await run(first));
if(!best){
try{
const r=await fetch("https://api.lyrics.ovh/v1/"+encodeURIComponent(artist)+"/"+encodeURIComponent(cname));
if(r.ok){
const j=await r.json();
if(j.lyrics&&j.lyrics.trim())best={plainLyrics:j.lyrics.replace(/\r/g,"").replace(/^Paroles de la chanson.*\n/i,"").trim()};
}
}catch(e){}
}
return best;
}

function fetchLyrics(tr){
if(cache.has(tr.id))return cache.get(tr.id);
const p=(async()=>{
let err;
for(let i=0;i<3;i++){
try{return await findLyrics(tr)}catch(e){err=e;await new Promise(r=>setTimeout(r,500*(i+1)))}
}
throw err;
})();
cache.set(tr.id,p);
p.catch(()=>cache.delete(tr.id));
return p;
}

async function prefetchNext(id){
try{
const at=await token();
if(!at)return;
const r=await fetch("https://api.spotify.com/v1/me/player/queue",{headers:{Authorization:"Bearer "+at}});
if(!r.ok||cur.id!==id)return;
const q=await r.json();
(q.queue||[]).slice(0,2).forEach(t=>{if(t&&t.artists&&t.album&&!cache.has(t.id))fetchLyrics(t).catch(()=>{})});
}catch(e){}
}

function stageOut(dir){
if(!els.length&&!stage.classList.contains("plain"))return Promise.resolve();
if(stageAnim)return stageAnim.finished.catch(()=>{});
stageAnim=stage.animate([{opacity:1,transform:"none",filter:"blur(0px)"},{opacity:0,transform:"translateY("+(-dir*44)+"px) scale(.985)",filter:"blur(10px)"}],{duration:380,easing:"cubic-bezier(.5,0,.75,0)",fill:"forwards"});
return stageAnim.finished.catch(()=>{});
}
function restoreStage(){
if(!stageAnim)return;
stageAnim.cancel();
stageAnim=null;
stage.animate([{opacity:0,transform:"translateY(30px)",filter:"blur(8px)"}],{duration:800,easing:EASE});
}

function build(list,isSynced,dir,plain){
if(stageAnim){stageAnim.cancel();stageAnim=null}
inDir=dir||1;
trackEl.textContent="";
stage.classList.toggle("plain",!!plain);
stage.scrollTop=0;
if(plain){const tg=document.createElement("div");tg.className="tag";tg.textContent="These lyrics aren’t synced.";trackEl.appendChild(tg)}
els=list.map(x=>{const d=document.createElement("div");d.className="l";d.textContent=x.s||"♪";trackEl.appendChild(d);return d});
lines=list;synced=isSynced;active=-2;fresh=isSynced&&list.length>0;
trackEl.style.transition="none";
trackEl.style.transform="translateY("+(lyr.clientHeight*.4)+"px)";
void trackEl.offsetWidth;
trackEl.style.transition="";
if(plain&&list.length)stage.animate([{opacity:0,transform:"translateY("+(inDir*36)+"px)",filter:"blur(8px)"}],{duration:900,easing:EASE});
}

function setNote(t,retry){
note.textContent=t;
note.style.opacity=t?1:0;
if(t&&retry){
const b=document.createElement("button");
b.textContent="Search again";
b.onclick=()=>{if(!cur.tr)return;cache.delete(cur.tr.id);loadTrack(cur.tr,1)};
note.appendChild(b);
}
}

async function loadTrack(tr,dir){
const my=tr.id,live=()=>cur.id===my;
const p=fetchLyrics(tr);
await stageOut(dir);
if(!live())return;
build([],false,dir);
setNote("");
const early=await Promise.race([p.then(()=>1,()=>1),new Promise(r=>setTimeout(()=>r(0),250))]);
if(!early&&live())setNote("Finding lyrics…");
let data=null,failed=false;
try{data=await p}catch(e){failed=true}
if(!live())return;
setNote("");
if(failed){setNote("Couldn’t reach the lyrics service.",true);return}
setTimeout(()=>prefetchNext(my),1500);
if(!data){setNote("No lyrics found for this song.",true);return}
if(data.instrumental){setNote("Instrumental");return}
if(data.syncedLyrics){
const l=parseLRC(data.syncedLyrics);
if(l.length){build(l,true,dir);return}
}
if(data.plainLyrics){
build(data.plainLyrics.split("\n").map(s=>({t:0,s:s.trim()})),false,dir,true);
return;
}
setNote("No lyrics found for this song.",true);
}

function pos(){return cur.playing?cur.pos+(performance.now()-cur.at):cur.pos}
function findIndex(t){
let lo=0,hi=lines.length-1,r=-1;
while(lo<=hi){const m=(lo+hi)>>1;if(lines[m].t<=t){r=m;lo=m+1}else hi=m-1}
return r;
}
function center(i){
const el=els[i];
if(!el)return;
trackEl.style.transform="translateY("+(lyr.clientHeight*.4-(el.offsetTop+el.offsetHeight/2))+"px)";
}
function setActive(i){
const prev=active;
active=i;
for(let k=Math.max(0,Math.min(prev,i)-3);k<=Math.min(els.length-1,Math.max(prev,i)+3);k++){
const d=k-i;
els[k].className="l"+(d===0?" a":d===1?" n":d===-1?" p":"");
}
if(i>=0)center(i);
if(fresh){
fresh=false;
const s=Math.max(0,i-2);
for(let k=s;k<Math.min(els.length,s+8);k++){
els[k].animate([{opacity:0,transform:"translateY("+(inDir*38)+"px) scale(.96)",filter:"blur(10px)"}],{duration:1000,delay:(k-s)*65,easing:EASE,fill:"backwards"});
}
}
}

function frame(){
const real=pos();
const shown=seeking?seekRatio*cur.dur:real;
if(synced&&els.length){
const i=findIndex(shown+offset);
if(i!==active)setActive(i);
}
if(cur.id){
const p=Math.min(shown,cur.dur),r=cur.dur?p/cur.dur:0;
$("fill").style.transform="scaleX("+r+")";
$("knob").style.left=r*100+"%";
const s=Math.floor(p/1000);
if(s!==lastSec){lastSec=s;$("cur").textContent=fmt(p)}
if(cur.playing&&!endPolled&&cur.dur&&real>=cur.dur-30){endPolled=true;setTimeout(!isGuest?poll:()=>{},120)}
}
requestAnimationFrame(frame);
}

function setPlayingUI(){
$("pp").dataset.state=cur.playing?"playing":"paused";
$("pp").setAttribute("aria-label",cur.playing?"Pause":"Play");
$("artbox").classList.toggle("paused",!cur.playing);
$("wrap").classList.toggle("paused",!cur.playing);
}

async function swapText(el,text,dir,delay){
const id=(el._id=(el._id||0)+1);
if(el.dataset.ready){
await el.animate([{opacity:1,transform:"none",filter:"blur(0px)"},{opacity:0,transform:"translateX("+(-dir*22)+"px)",filter:"blur(6px)"}],{duration:260,delay,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"}).finished.catch(()=>{});
}
if(el._id!==id)return;
el.getAnimations().forEach(a=>a.cancel());
el.textContent=text;
el.dataset.ready="1";
el.animate([{opacity:0,transform:"translateX("+(dir*22)+"px)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0px)"}],{duration:800,easing:EASE});
}

// Extract dominant color from album art to match theme gradient & glow
function extractCoverColor(imgUrl){
if(!imgUrl)return;
const img=new Image();
img.crossOrigin="Anonymous";
img.src=imgUrl;
img.onload=()=>{
try{
const canvas=$("canvas"),ctx=canvas.getContext("2d");
canvas.width=50;canvas.height=50;
ctx.drawImage(img,0,0,50,50);
const data=ctx.getImageData(0,0,50,50).data;
let r=0,g=0,b=0,count=0;
for(let i=0;i<data.length;i+=16){r+=data[i];g+=data[i+1];b+=data[i+2];count++}
r=Math.floor(r/count);g=Math.floor(g/count);b=Math.floor(b/count);
const col=`rgb(${r},${g},${b})`;
const darkCol=`rgb(${Math.floor(r*.15)},${Math.floor(g*.15)},${Math.floor(b*.15)})`;
document.documentElement.style.setProperty("--bg",darkCol);
document.documentElement.style.setProperty("--glow-col",col);
}catch(e){}
};
}

async function swapArt(src,dir){
if(!src)return;
artEl.src=src;
extractCoverColor(src);
artEl.animate([{opacity:0,transform:"scale(.9)"},{opacity:1,transform:"scale(1)"}],{duration:800,easing:EASE});
}

function flash(){
$("pulse").animate([{opacity:.25,transform:"scale(1)"},{opacity:.85,transform:"scale(1.3)",offset:.25},{opacity:.25,transform:"scale(1)"}],{duration:1600,easing:EASE});
}

function applyState(d,t0,t1){
const idle=$("idle");
if(!d||!d.item||d.currently_playing_type==="ad"){
idle.style.display="flex";
cur.playing=false;
setPlayingUI();
return;
}
idle.style.display="none";
const tr=d.item;
const anchor=d.progress_ms+(t1?((t1-t0)/2):0);
const now=performance.now();
if(tr.id!==cur.id){
const dir=fxDir;
fxDir=1;
cur={id:tr.id,dur:tr.duration_ms,playing:d.is_playing,pos:anchor,at:now,tr};
endPolled=false;hold=0;lastSec=-1;
swapText($("title"),tr.name,dir,0);
swapText($("artist"),tr.artists.map(a=>a.name).join(", "),dir,70);
$("dur").textContent=fmt(tr.duration_ms);
document.title=tr.name+" · Synchrony";
swapArt((tr.album.images[0]||{}).url,dir);
$("fill").classList.add("glide");
setTimeout(()=>$("fill").classList.remove("glide"),900);
flash();
loadTrack(tr,dir);
}else if(now>=hold){
const predicted=cur.playing?cur.pos+(now-cur.at):cur.pos;
const diff=anchor-predicted;
if(!d.is_playing||!cur.playing||Math.abs(diff)>250){cur.pos=anchor;cur.at=now}
else{cur.pos=predicted+diff*.25;cur.at=now}
cur.playing=d.is_playing;
if(cur.dur-anchor>400)endPolled=false;
}
setPlayingUI();

// If Host, broadcast to localStorage for party guests
if(!isGuest && partyCode){
  store.set("sy_party_"+partyCode,JSON.stringify({d,t0:performance.now(),t1:performance.now()}));
}
}

let polling=false,timer=null;
async function poll(){
if(isGuest||polling)return;
polling=true;
clearTimeout(timer);
let wait=1000;
try{
const at=await token();
if(!at){showLogin();polling=false;return}
const t0=performance.now();
const r=await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=track",{headers:{Authorization:"Bearer "+at},cache:"no-store"});
const t1=performance.now();
if(r.status===204)applyState(null);
else if(r.status===429)wait=(Number(r.headers.get("Retry-After"))||5)*1000;
else if(r.status===401){store.del("sy_at");store.del("sy_exp");wait=200}
else if(r.ok)applyState(await r.json(),t0,t1);
else wait=3000;
}catch(e){wait=2000}
polling=false;
timer=setTimeout(poll,wait);
}
const kick=ms=>setTimeout(!isGuest?poll:()=>{},ms);

// Guest Party Polling
function startGuestSync(){
  // Generate random party code if host
  if(!partyCode){
    partyCode=Math.floor(1000+Math.random()*9000).toString();
  }
  $("party-badge").style.display="block";
  $("party-badge").textContent="Party Code: "+partyCode;
  $("party-badge").onclick=()=>{navigator.clipboard.writeText(partyCode);toast("Party code copied!")};

  if(isGuest){
    setInterval(()=>{
      const raw=store.get("sy_party_"+partyCode);
      if(raw){
        try{
          const pkt=JSON.parse(raw);
          applyState(pkt.d, pkt.t0, pkt.t1);
        }catch(e){}
      }
    },500);
  } else {
    // Host active state broadcast timer
    setInterval(()=>{
      if(cur.id){
        store.set("sy_party_"+partyCode,JSON.stringify({
          d:{item:cur.tr,is_playing:cur.playing,progress_ms:pos(),duration_ms:cur.dur},
          t0:performance.now(),t1:performance.now()
        }));
      }
    },800);
  }
}

async function api(method,path,params){
if(isGuest){toast("Guest controls synced via host.");return true;}
const at=await token();
if(!at){showLogin();return false}
try{
const r=await fetch("https://api.spotify.com/v1/me/player/"+path+(params?"?"+new URLSearchParams(params):""),{method,headers:{Authorization:"Bearer "+at}});
if(r.ok)return true;
if(r.status===401){store.del("sy_at");store.del("sy_exp")}
else if(r.status===403)toast("Playback controls need Spotify Premium.");
else if(r.status===404)toast("No active device. Press play in Spotify first.");
else if(r.status===429)toast("Too many requests. Try again in a moment.");
else toast("Spotify couldn’t do that. Try again.");
}catch(e){toast("Connection problem. Try again.")}
return false;
}

$("pp").onclick=async()=>{
const was=cur.playing,now=performance.now();
if(cur.id){cur.pos=pos();cur.at=now;cur.playing=!was;hold=now+900;setPlayingUI()}
const ok=await api("PUT",was?"pause":"play");
if(!ok&&cur.id){cur.pos=pos();cur.at=performance.now();cur.playing=was;hold=0;setPlayingUI()}
kick(350);
};

function skipFx(dir){
const btn=dir>0?$("next"):$("prev");
btn.querySelector("svg").animate([{transform:"translateX(0)"},{transform:"translateX("+(dir*10)+"px)",offset:.3},{transform:"translateX(0)"}],{duration:650,easing:"cubic-bezier(.34,1.56,.64,1)"});
btn.animate([{transform:"scale(1)"},{transform:"scale(.84)",offset:.25},{transform:"scale(1)"}],{duration:560,easing:"cubic-bezier(.34,1.56,.64,1)"});
}
async function skip(dir){
skipFx(dir);
if(dir<0&&pos()>3000){doSeek(0);return}
const id=cur.id;
fxDir=dir;
stageOut(dir);
const ok=await api("POST",dir>0?"next":"previous");
if(!ok){fxDir=1;restoreStage();return}
kick(250);kick(800);kick(1600);
setTimeout(()=>{if(cur.id===id&&stageAnim)restoreStage()},4500);
}
$("next").onclick=()=>skip(1);
$("prev").onclick=()=>skip(-1);

function ratioFrom(e){const r=bar.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}
function doSeek(ms){
ms=Math.max(0,Math.min(cur.dur-300,Math.round(ms)));
cur.pos=ms;cur.at=performance.now();hold=cur.at+1200;endPolled=false;lastSec=-1;
api("PUT","seek",{position_ms:ms});
kick(500);
}
bar.addEventListener("pointerdown",e=>{if(!cur.id)return;seeking=true;seekRatio=ratioFrom(e);bar.setPointerCapture(e.pointerId);bar.classList.add("drag")});
bar.addEventListener("pointermove",e=>{if(seeking)seekRatio=ratioFrom(e)});
bar.addEventListener("pointerup",()=>{if(!seeking)return;seeking=false;bar.classList.remove("drag");doSeek(seekRatio*cur.dur)});
bar.addEventListener("pointercancel",()=>{seeking=false;bar.classList.remove("drag")});
bar.addEventListener("keydown",e=>{
if(!cur.id)return;
if(e.key==="ArrowRight"){e.preventDefault();doSeek(pos()+5000)}
if(e.key==="ArrowLeft"){e.preventDefault();doSeek(pos()-5000)}
});

document.addEventListener("visibilitychange",()=>{if(!document.hidden && !isGuest)poll()});
window.addEventListener("resize",()=>{if(active>=0)center(active)});

(async function init(){
const params=new URLSearchParams(location.search);
const guestCode=store.get("sy_party_guest");
if(guestCode){
  isGuest=true;
  partyCode=guestCode;
  showApp();
  startGuestSync();
  requestAnimationFrame(frame);
  return;
}
if(params.get("code")){
const v=store.get("sy_v");
history.replaceState({},"",REDIRECT);
if(v){
try{await tokenRequest({grant_type:"authorization_code",code:params.get("code"),redirect_uri:REDIRECT,client_id:CLIENT_ID,code_verifier:v})}catch(e){}
store.del("sy_v");
}
}else if(params.get("error")){history.replaceState({},"",REDIRECT)}
if(await token()){
  showApp();
  startGuestSync(); // Host starts code broadcast
  requestAnimationFrame(frame);
  poll();
}
else showLogin();
})();
</script>
</body>
