<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<style>
  :root {
    --bg: #f3f1ee;
    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --accent: #1db954;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #f2f2f2; --muted: #9a9a9a; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  main { padding: 24px; max-width: 100%; }
  button {
    background: var(--accent); color: #000; border: 0; border-radius: 999px;
    padding: 14px 28px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  #cover {
    width: min(80vw, 480px); height: min(80vw, 480px);
    object-fit: cover; border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  #status { color: var(--muted); margin-top: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="login" hidden>
    <p>Connect Spotify to show the cover of the song you’re playing.</p>
    <button id="loginBtn">Connect Spotify</button>
  </div>
  <div id="player" hidden>
    <img id="cover" alt="Album cover" hidden>
    <p id="status"></p>
  </div>
</main>

<script>
const CLIENT_ID = "c361237077b7462180c155eafff8aeda";
const REDIRECT_URI = "https://synchronydemo.github.io/"; // must match the dashboard exactly
const SCOPE = "user-read-currently-playing";

const $ = (id) => document.getElementById(id);

// ---------- PKCE helpers ----------
function randomString(len) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const arr = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(arr, (x) => chars[x % chars.length]).join("");
}
async function challengeFor(verifier) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
}

async function login() {
  const verifier = randomString(64);
  localStorage.setItem("sp_verifier", verifier);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPE,
    code_challenge_method: "S256",
    code_challenge: await challengeFor(verifier),
  });
  location.href = "https://accounts.spotify.com/authorize?" + params;
}

async function tokenRequest(body) {
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CLIENT_ID, ...body }),
  });
  if (!res.ok) throw new Error("Token request failed");
  const t = await res.json();
  localStorage.setItem("sp_access", t.access_token);
  localStorage.setItem("sp_expires", Date.now() + t.expires_in * 1000);
  if (t.refresh_token) localStorage.setItem("sp_refresh", t.refresh_token);
  return t.access_token;
}

async function getToken() {
  const access = localStorage.getItem("sp_access");
  if (access && Date.now() < Number(localStorage.getItem("sp_expires")) - 30000) return access;
  const refresh = localStorage.getItem("sp_refresh");
  if (!refresh) return null;
  try {
    return await tokenRequest({ grant_type: "refresh_token", refresh_token: refresh });
  } catch { return null; }
}

// ---------- Now playing ----------
let lastImage = "";
async function update() {
  const token = await getToken();
  if (!token) return showLogin();
  try {
    const res = await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode", {
      headers: { Authorization: "Bearer " + token },
    });
    if (res.status === 401) { localStorage.removeItem("sp_access"); return; }
    if (res.status === 204 || !res.ok) return showStatus("Nothing is playing right now.");
    const data = await res.json();
    const item = data.item;
    const images = item && (item.album ? item.album.images : item.images);
    if (!images || !images.length) return showStatus("Nothing is playing right now.");
    const url = images[0].url;
    if (url !== lastImage) { $("cover").src = url; lastImage = url; }
    $("cover").hidden = false;
    $("status").textContent = item.name;
    $("player").hidden = false; $("login").hidden = true;
  } catch {
    showStatus("Couldn’t reach Spotify. Retrying…");
  }
}
function showStatus(msg) {
  $("cover").hidden = true; lastImage = "";
  $("status").textContent = msg;
  $("player").hidden = false; $("login").hidden = true;
}
function showLogin() {
  $("login").hidden = false; $("player").hidden = true;
}

// ---------- Boot ----------
$("loginBtn").addEventListener("click", login);

(async function init() {
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    try {
      await tokenRequest({
        grant_type: "authorization_code",
        code,
        redirect_uri: REDIRECT_URI,
        code_verifier: localStorage.getItem("sp_verifier"),
      });
    } catch {}
    history.replaceState({}, "", REDIRECT_URI); // clean the ?code= from the URL
  }
  await update();
  setInterval(update, 5000);
})();
</script>
</body>
</html>
