<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNCHRONY — You Never Miss a Verse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #030305;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Liquid Glow Background */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, rgba(236, 72, 153, 0.1) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(80px);
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Sheet Music Waves Background */
        .waves-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }

        .wave-line {
            position: absolute;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            left: -50%;
            animation: waveMove 12s linear infinite;
        }

        .wave-line:nth-child(1) { top: 30%; animation-duration: 10s; }
        .wave-line:nth-child(2) { top: 40%; animation-duration: 14s; opacity: 0.5; }
        .wave-line:nth-child(3) { top: 50%; animation-duration: 8s; }
        .wave-line:nth-child(4) { top: 60%; animation-duration: 16s; opacity: 0.7; }
        .wave-line:nth-child(5) { top: 70%; animation-duration: 11s; }

        @keyframes waveMove {
            0% { transform: translateX(0) skewY(0deg); }
            50% { transform: translateX(25%) skewY(2deg); }
            100% { transform: translateX(50%) skewY(0deg); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* Apple Liquid Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 3rem 2rem;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: introTikTok 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes introTikTok {
            0% { opacity: 0; transform: scale(0.85) translateY(40px); filter: blur(10px); }
            60% { transform: scale(1.02) translateY(-5px); filter: blur(0px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        }

        /* Logo Animation */
        .logo-wrapper {
            margin-bottom: 1.5rem;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.4)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.8)); }
        }

        .logo-svg {
            width: 64px;
            height: 64px;
            fill: url(#liquid-gradient);
        }

        /* Typography */
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 0.95rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.05em;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .tagline span {
            color: #f472b6;
            font-weight: 500;
        }

        /* Spotify Liquid Glass Button */
        .spotify-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: rgba(29, 185, 84, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(29, 185, 84, 0.4);
            border-radius: 50px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.2);
        }

        .spotify-btn:hover {
            background: rgba(29, 185, 84, 0.3);
            border-color: rgba(29, 185, 84, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(29, 185, 84, 0.4);
        }

        .spotify-btn svg {
            width: 20px;
            height: 20px;
            fill: #1db954;
        }

        /* Coming Soon Screen */
        #coming-soon-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #coming-soon-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .coming-soon-title {
            font-size: 2rem;
            font-weight: 200;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            animation: breatheText 4s ease-in-out infinite alternate;
        }

        @keyframes breatheText {
            0% { opacity: 0.4; letter-spacing: 0.4em; }
            100% { opacity: 1; letter-spacing: 0.6em; }
        }
    </style>
</head>
<body>

    <!-- Ambient & Wave Backgrounds -->
    <div class="ambient-glow"></div>
    <div class="waves-container">
        <div class="wave-line"></div>
        <div class="wave-line"></div>
        <div class="wave-line"></div>
        <div class="wave-line"></div>
        <div class="wave-line"></div>
    </div>

    <!-- SVG Gradients -->
    <svg width="0" height="0">
        <defs>
            <linearGradient id="liquid-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ec4899" />
                <stop offset="50%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Intro Card -->
    <div class="container" id="intro-container">
        <div class="glass-card">
            <div class="logo-wrapper">
                <svg class="logo-svg" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>
            <h1>Synchrony</h1>
            <p class="tagline">In perfect rhythm with your soul.<br>Because <span>you never miss a verse.</span></p>
            
            <a href="#" id="spotify-login-btn" class="spotify-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.72.48-1.08.24-2.999-1.84-6.78-2.259-11.22-1.24-.419.12-.84-.12-.96-.54-.12-.42.12-.84.54-.96 4.8-1.1 9.06-.6 12.48 1.56.36.24.48.72.24 1.08zm1.44-3.84c-.3.48-.9.66-1.38.36-3.42-2.1-8.64-2.73-12.66-1.5-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.44-1.35 10.2-}$.06 14.22 2.34.48.3.66.9.36 1.38zm.12-4.08C13.95 7.14 8.1 6.96 4.8 7.95c-.63.19-1.3-.17-1.49-.8-.19-.63.17-1.3.8-1.49 3.84-1.16 10.32-.93 14.88 1.83.57.34.75 1.08.41 1.65-.34.57-1.08.75-1.65.41z"/>
                </svg>
                Connect with Spotify
            </a>
        </div>
    </div>

    <!-- Black Coming Soon Screen -->
    <div id="coming-soon-screen">
        <h2 class="coming-soon-title">Coming Soon</h2>
    </div>

    <script>
        const CLIENT_ID = 'c361237077b7462180c155eafff8aeda';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        // Construct Spotify Auth URL (Implicit Grant for GitHub Pages static hosting)
        const scopes = 'user-read-private user-read-email user-read-playback-state';
        const spotifyAuthUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(scopes)}&show_dialog=true`;

        document.getElementById('spotify-login-btn').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = spotifyAuthUrl;
        });

        // Check if returning from Spotify auth callback
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');

            if (accessToken || localStorage.getItem('synchrony_authenticated')) {
                if (accessToken) {
                    localStorage.setItem('synchrony_authenticated', 'true');
                }
                // Fade out intro, show pristine black coming soon page
                const intro = document.getElementById('intro-container');
                const comingSoon = document.getElementById('coming-soon-screen');
                
                intro.style.opacity = '0';
                intro.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    intro.style.display = 'none';
                    comingSoon.classList.add('active');
                }, 600);
            }
        });
    </script>
</body>
</html>
