<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="status">Connecting...</h1>
  </div>

  <script>
    const clientId = 'c361237077b7462180c155eafff8aeda';
    const redirectUri = 'https://synchronydemo.github.io/';
    const scope = 'user-read-private user-read-email';

    function getHashParams() {
      const hashParams = {};
      const hash = window.location.hash.substring(1);
      const params = hash.split('&');
      for (let i = 0; i < params.length; i++) {
        if (!params[i]) continue;
        const pair = params[i].split('=');
        hashParams[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
      }
      return hashParams;
    }

    const params = getHashParams();

    if (params.access_token) {
      window.location.hash = '';
      document.getElementById('status').innerText = 'COMING SOON';
    } else {
      const authUrl = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(scope)}`;
      window.location.href = authUrl;
    }
  </script>
</body>
</html>
