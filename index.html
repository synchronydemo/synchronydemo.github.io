<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synchrony</title>
<style>
:root{--fg:#fff;--mid:rgba(255,255,255,.62);--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,.g{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.28)}
button{font:inherit;color:inherit;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;transition:background .3s var(--ease),transform .4s var(--ease)}
button:hover{background:rgba(255,255,255,.2)}
button:active{transform:scale(.94)}
button:disabled{opacity:.5;pointer-events:none}
button.link{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--mid);text-decoration:underline;text-underline-offset:5px}
#bg{position:fixed;inset:0;z-index:0;background:#111;overflow:hidden}
#bg img{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(90px) saturate(1.9) brightness(.55);transition:opacity 1.2s}
#login{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:24px}
#login h1{font-size:clamp(48px,11vw,120px);font-weight:700;letter-spacing:-.05em;line-height:.95}
#login p{color:var(--mid);max-width:36ch;line-height:1.5}
#app{display:none;position:relative;z-index:1;height:100%;grid-template-columns:minmax(320px,440px) 1fr;gap:clamp(24px,5vw,80px);padding:84px clamp(20px,4vw,56px) 28px}
.brand{position:absolute;top:26px;left:clamp(20px,4vw,56px);font-weight:700;font-size:20px;letter-spacing:-.03em}
#top{position:absolute;top:16px;right:clamp(20px,4vw,56px);display:flex;gap:10px;align-items:center;z-index:3}
#sbox{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;height:40px;width:min(36vw,300px)}
#sbox svg{flex:none;opacity:.7}
#q{background:none;border:0;outline:none;color:var(--fg);font:inherit;font-size:15px;width:100%}
#q::placeholder{color:var(--mid)}
#player{display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
#art{width:min(100%,max(140px,calc(100dvh - 430px)));aspect-ratio:1;margin:0 auto;border-radius:18px;object-fit:cover;background:#222;box-shadow:0 30px 70px rgba(0,0,0,.5);transition:transform 1s var(--ease)}
#art.p{transform:scale(.93)}
#title{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:var(--mid);margin-top:2px;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#singer{display:flex;visibility:hidden;align-self:flex-start;max-width:100%;border-radius:999px;overflow:hidden;min-height:36px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 24px rgba(0,0,0,.3)}
#singer.on{visibility:visible}
#singer span{padding:8px 18px;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:20px;display:flex;align-items:center;cursor:pointer}
.trk{width:100%;height:5px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
#fill{height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.times{display:flex;justify-content:space-between;color:var(--mid);font-size:12px;font-variant-numeric:tabular-nums}
.ctls{display:flex;justify-content:center;align-items:center;gap:16px}
.ctl{padding:0;width:48px;height:48px;display:grid;place-items:center}
.ctl.big{width:68px;height:68px;background:rgba(255,255,255,.24)}
.ctl.on{background:rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 24px rgba(255,255,255,.25)}
#lyrics{position:relative;overflow:hidden;min-height:0}
#lm{position:absolute;inset:0;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 82%,transparent)}
#track{position:absolute;left:0;right:0;top:0;padding:0 8px;transition:transform .9s var(--ease)}
#track.plain{position:relative;transform:none!important}
.l{font-size:clamp(26px,3.6vw,50px);font-weight:700;letter-spacing:-.03em;line-height:1.14;padding:.32em 0;opacity:.24;filter:blur(1.5px);transform:scale(.95);transform-origin:left center;transition:opacity .6s var(--ease),filter .6s var(--ease),transform .9s var(--ease);overflow-wrap:anywhere;cursor:pointer}
.l.n{opacity:.42;filter:blur(.6px)}
.l.a{opacity:1;filter:none;transform:scale(1)}
.l.p{opacity:.5;filter:none}
#track.plain .l{font-size:clamp(20px,2.4vw,28px);opacity:.88;filter:none;transform:none;padding:.15em 0;cursor:default}
#note{position:absolute;inset:0;display:flex;align-items:center;font-size:clamp(22px,3vw,38px);font-weight:700;color:var(--mid);pointer-events:none}
#lib{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;background:rgba(14,14,18,.5);-webkit-backdrop-filter:blur(60px) saturate(180%);backdrop-filter:blur(60px) saturate(180%);padding:20px clamp(16px,4vw,56px)}
#lib.on{display:flex;animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.lh{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lh h2{font-size:28px;letter-spacing:-.03em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lbody{overflow-y:auto;flex:1;scrollbar-width:none;padding-bottom:40px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.card{cursor:pointer}
.card img,.card .ph{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#2a2a30;display:block;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.card b{display:block;margin-top:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--mid);font-size:12px}
.sec{color:var(--mid);font-size:13px;font-weight:600;margin:18px 12px 6px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:14px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.08)}
.row.cur{background:rgba(255,255,255,.12)}
.row img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#2a2a30;flex:none}
.rm{flex:1;min-width:0}
.rm b,.rm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm b{font-size:15px}
.rm span{color:var(--mid);font-size:13px;margin-top:2px}
.ib{padding:0;width:34px;height:34px;display:grid;place-items:center;font-size:14px;flex:none}
.emp{color:var(--mid);padding:30px 12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .4s,transform .5s var(--ease);z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:12px;padding:100px 20px 16px}
#top{left:20px;right:20px;top:62px}
#sbox{flex:1;width:auto}
#art{width:110px;margin:0}
#player{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px}
.meta{flex:1;min-width:0}
#title{font-size:20px}
#singer,.bar,.times,.ctls{flex-basis:100%}
.times,.bar{width:100%}
}
@media (prefers-reduced-motion:reduce){#track,.l,#art{transition:none}}
</style>
</head>
<body>
<div id="bg"><img id="bgi" alt=""></div>
<div id="login">
<h1>Synchrony</h1>
<p>Live lyrics, singers and playback controls for whatever you’re playing on Spotify.</p>
<button id="connect">Connect Spotify</button>
</div>
<div id="app">
<div class="brand">Synchrony</div>
<div id="top">
<div class="g" id="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="q" placeholder="Search songs" autocomplete="off" spellcheck="false"></div>
<button id="bpl">Playlists</button>
</div>
<section id="player">
<img id="art" class="p" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
<div class="meta"><div id="title">Nothing playing</div><div id="artist">Press play in Spotify</div></div>
<div id="singer"></div>
<div class="bar" id="bar"><div class="trk"><div id="fill"></div></div></div>
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="ctls">
<button class="ctl" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
<button class="ctl" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
<button class="ctl big" id="pp" aria-label="Play"><svg id="ppi" viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
<button class="ctl" id="next" aria-label="Next"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
<button class="ctl" id="bq" aria-label="Queue"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></button>
</div>
</section>
<section id="lyrics"><div id="lm"><div id="note"></div><div id="track"></div></div></section>
</div>
<div id="lib"><div class="lh"><button id="lback">‹ Now Playing</button><button id="lup" style="display:none">‹ Playlists</button><h2 id="lt"></h2><span id="lact"></span></div><div id="lbody"></div></div>
<div id="toast" class="g"></div>
<script>
const CID="a199a4190b6542aa8ea7605253c9b931",RU=location.origin+location.pathname,SC="user-read-currently-playing user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative";
const EASE="cubic-bezier(.16,1,.3,1)",PAL=["#ff5a52","#4d8dff","#33d17a","#ffb02e","#9b7bff","#2fd0d0"];
const $=i=>document.getElementById(i);
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3000)}
async function login(){
const v=b64(crypto.getRandomValues(new Uint8Array(64)));
const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
st.set("sy_v",v);
location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:CID,response_type:"code",redirect_uri:RU,scope:SC,code_challenge_method:"S256",code_challenge:c});
}
async function tokReq(body){
const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
if(!r.ok)throw 0;
const d=await r.json();
st.set("sy_at",d.access_token);st.set("sy_exp",String(Date.now()+d.expires_in*1000-30000));st.set("sy_scope",SC);
if(d.refresh_token)st.set("sy_rt",d.refresh_token);
return d.access_token;
}
async function token(){
const wipe=()=>["sy_at","sy_exp","sy_rt"].forEach(st.del);
if(st.get("sy_scope")!==SC){wipe();return null}
const at=st.get("sy_at");
if(at&&Date.now()<Number(st.get("sy_exp")))return at;
const rt=st.get("sy_rt");
if(!rt)return null;
try{return await tokReq({grant_type:"refresh_token",refresh_token:rt,client_id:CID})}catch(e){wipe();return null}
}
async function sp(method,path,body,quiet){
const at=await token();
if(!at){$("app").style.display="none";$("login").style.display="flex";return null}
try{
const r=await fetch("https://api.spotify.com/v1/"+path,{method,headers:Object.assign({Authorization:"Bearer "+at},body?{"Content-Type":"application/json"}:{}),body:body?JSON.stringify(body):undefined});
if(r.status===204)return{};
if(!r.ok){
if(!quiet)toast(r.status===403?"That needs Spotify Premium or more permissions.":r.status===404?"No active device. Press play in Spotify first.":r.status===429?"Too many requests. Try again soon.":"Spotify couldn’t do that.");
return null;
}
const t=await r.text();
return t?JSON.parse(t):{};
}catch(e){if(!quiet)toast("Connection problem.");return null}
}
$("connect").onclick=login;

const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim();
const clean=s=>s.replace(/\s*[\(\[][^\)\]]*[\)\]]/g,"").replace(/\s+-\s+.*$/,"").trim()||s;
const toks=s=>norm(s).split(" ").filter(Boolean);
const jac=(a,b)=>{if(!a.length||!b.length)return 0;const A=new Set(a),B=new Set(b);let n=0;A.forEach(w=>{if(B.has(w))n++});return n/(A.size+B.size-n)};
const sameName=(a,b)=>{const x=norm(a),y=norm(b);return !!x&&!!y&&(x===y||(" "+x+" ").includes(" "+y+" ")||(" "+y+" ").includes(" "+x+" "))};

let cur={id:null,dur:0,playing:false,pos:0,at:0,tr:null},lines=[],els=[],W=[],roster=[],active=-2,synced=false,shuf=false,view="",hold=0,uq=[],dragI=null,seeking=false;
const pos=()=>cur.playing?cur.pos+(performance.now()-cur.at):cur.pos;
const trackEl=$("track"),lyr=$("lyrics");

const PX=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)];
async function viaProxy(u,json){
for(const p of PX){try{const r=await fetch(p(u),{signal:AbortSignal.timeout(9000)});if(r.ok)return json?await r.json():await r.text()}catch(e){}}
return null;
}
function parseLRC(t){
const out=[];
for(const raw of t.split("\n")){
const m=raw.match(/^((?:\[\d+:\d+(?:[.:]\d+)?\])+)\s*(.*)$/);
if(!m)continue;
const s=m[2].replace(/<\d+:\d+(?:[.:]\d+)?>/g,"").replace(/\s+/g," ").trim();
for(const tm of m[1].matchAll(/\[(\d+):(\d+)(?:[.:](\d+))?\]/g))out.push({t:(Number(tm[1])*60+Number(tm[2])+(tm[3]?Number("0."+tm[3]):0))*1000,s});
}
return out.sort((a,b)=>a.t-b.t);
}
async function lrc(tr){
const a=tr.artists[0].name,n=clean(tr.name),d=Math.round(tr.duration_ms/1000);
try{
let r=await fetch("https://lrclib.net/api/get?"+new URLSearchParams({artist_name:a,track_name:n,album_name:tr.album.name,duration:d}));
if(r.ok){const j=await r.json();if(j.syncedLyrics||j.plainLyrics)return j}
r=await fetch("https://lrclib.net/api/search?"+new URLSearchParams({track_name:n,artist_name:a}));
if(!r.ok)return null;
const j=await r.json();
return j.find(x=>x.syncedLyrics&&Math.abs(x.duration-d)<8)||j.find(x=>x.syncedLyrics)||j.find(x=>x.plainLyrics)||null;
}catch(e){return null}
}
async function genius(tr){
const n=clean(tr.name),as=tr.artists.map(a=>norm(a.name));
const s=await viaProxy("https://genius.com/api/search/multi?per_page=6&q="+encodeURIComponent(tr.artists[0].name+" "+n),true);
const hits=((s&&s.response&&s.response.sections)||[]).flatMap(x=>x.hits||[]).filter(x=>x.result&&x.result.url&&x.result.primary_artist).map(x=>x.result);
const w=norm(n);
const hit=hits.find(x=>{const t=norm(x.title.replace(/\s*[\(\[][^\)\]]*[\)\]]/g,"")),pa=norm(x.primary_artist.name);return t===w&&as.some(a=>pa.includes(a)||a.includes(pa))});
if(!hit)return null;
const html=await viaProxy(hit.url);
if(!html)return null;
const doc=new DOMParser().parseFromString(html,"text/html");
doc.querySelectorAll('[data-exclude-from-selection="true"]').forEach(e=>e.remove());
const txt=[...doc.querySelectorAll('[data-lyrics-container="true"]')].map(e=>{e.querySelectorAll("br").forEach(b=>b.replaceWith("\n"));return e.textContent}).join("\n");
return txt.length>20?txt:null;
}
function ids(str,names){
const out=[];
for(const part of str.split(/\s*(?:,|&|\+|\bx\b|\band\b)\s*/i)){
const p=part.replace(/\([^)]*\)/g,"").trim();
if(!p||p.length>40)continue;
let k=names.findIndex(a=>sameName(a,p));
if(k<0){names.push(p);k=names.length-1}
if(!out.includes(k))out.push(k);
}
return out;
}
function parseG(raw,names){
const out=[];
let c=[0],mem=null;
for(const ln of raw.split("\n")){
const s=ln.trim();
if(!s)continue;
const m=s.match(/^\[(.*)\]$/);
if(m){
const x=m[1].match(/^([^:]*):\s*(.+)$/),rep=/chorus|hook|refrain/i.test(m[1]);
if(x){const r=ids(x[2],names);if(r.length){c=r;if(rep)mem=r}}
else c=rep&&mem?mem:[0];
continue;
}
out.push({w:c,t:toks(s)});
}
return out;
}
function align(L,g){
let p=0,last=[0];
return L.map(l=>{
const a=toks(l.s);
let b=-1,bs=.45;
for(let k=p;k<Math.min(g.length,p+14);k++){const j=jac(a,g[k].t);if(j>bs){bs=j;b=k}}
if(b>=0){p=b+1;last=g[b].w}
return last;
});
}

function pill(w){
const el=$("singer");
if(!w||!w.length){el.classList.remove("on");el._k="";return}
const k=w.join(",")+"|"+roster.length;
el.classList.add("on");
if(el._k===k)return;
el._k=k;
el.textContent="";
w.forEach(i=>{
const s=h("span","",roster[i]||"");
const c=PAL[i%PAL.length];
s.style.background="linear-gradient(135deg,"+c+",color-mix(in srgb,"+c+" 58%,#000))";
el.appendChild(s);
});
el.animate([{opacity:.3,transform:"scale(.94)"},{opacity:1,transform:"none"}],{duration:420,easing:EASE});
}
function build(list,plain){
trackEl.textContent="";
trackEl.classList.toggle("plain",!!plain);
els=list.map(x=>{const d=h("div","l",x.s||(plain?"\u00a0":"♪"));trackEl.appendChild(d);return d});
lines=list;synced=!plain&&list.length>0;active=-2;
trackEl.style.transition="none";
trackEl.style.transform="translateY("+lyr.clientHeight*.4+"px)";
void trackEl.offsetWidth;
trackEl.style.transition="";
}
trackEl.addEventListener("click",e=>{
if(!synced)return;
const i=els.indexOf(e.target.closest(".l"));
if(i>=0)seek(lines[i].t);
});
function setNote(t){$("note").textContent=t}
function setActive(i){
const prev=active;
active=i;
for(let k=Math.max(0,Math.min(prev,i)-3);k<=Math.min(els.length-1,Math.max(prev,i)+3);k++){
const d=k-i;
els[k].className="l"+(d===0?" a":d===1?" n":d===-1?" p":"");
}
if(i>=0&&els[i])trackEl.style.transform="translateY("+(lyr.clientHeight*.4-(els[i].offsetTop+els[i].offsetHeight/2))+"px)";
pill(synced&&W.length?W[Math.max(0,i)]:roster.length<2&&roster.length?[0]:null);
}
function findIndex(t){
let lo=0,hi=lines.length-1,r=-1;
while(lo<=hi){const m=(lo+hi)>>1;if(lines[m].t<=t){r=m;lo=m+1}else hi=m-1}
return r;
}

function rosterOf(tr){
const r=tr.artists.map(a=>a.name);
const m=tr.name.match(/[\(\[]\s*(?:feat\.?|ft\.?|featuring|with)\s+([^\)\]]+)[\)\]]/i);
if(m)ids(m[1],r);
return r;
}
async function loadLyrics(tr){
const my=tr.id,live=()=>cur.id===my;
build([],false);W=[];setNote("Finding lyrics…");pill(null);
const ly=await lrc(tr);
if(!live())return;
setNote("");
if(!ly){setNote("No lyrics found for this song.");return}
if(ly.instrumental){setNote("Instrumental");return}
if(ly.syncedLyrics){
const L=parseLRC(ly.syncedLyrics);
if(L.length){
build(L,false);
if(roster.length<2)pill([0]);
try{
const g=await genius(tr);
if(g&&live()){
const names=rosterOf(tr),gl=parseG(g,names);
if(gl.length){roster=names;W=align(L,gl);setActive(findIndex(pos()))}
}
}catch(e){}
return;
}
}
if(ly.plainLyrics)build(ly.plainLyrics.split("\n").map(s=>({t:0,s:s.trim()})),true);
else setNote("No lyrics found for this song.");
}

function newTrack(tr){
cur.id=tr.id;cur.dur=tr.duration_ms;cur.tr=tr;
roster=rosterOf(tr);
$("title").textContent=tr.name;
$("artist").textContent=tr.artists.map(a=>a.name).join(", ");
$("dur").textContent=fmt(cur.dur);
document.title=tr.name+" · Synchrony";
const u=(tr.album.images[0]||{}).url;
if(u){$("art").src=u;$("bgi").src=u}
$("art").animate([{opacity:0,transform:"scale(1.05)"},{opacity:1,transform:"none"}],{duration:800,easing:EASE});
if(view==="queue")setTimeout(openQueue,900);
loadLyrics(tr);
}
function paintPlay(){
$("ppi").innerHTML=cur.playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
$("art").classList.toggle("p",!cur.playing);
}
function paintShuf(){$("shuf").classList.toggle("on",shuf)}
function applyState(d,t0,t1){
if(!d||!d.item||d.currently_playing_type==="ad"){cur.playing=false;cur.id=null;paintPlay();return}
const now=performance.now(),tr=d.item;
if(now>hold){shuf=!!d.shuffle_state;paintShuf()}
if(tr.id!==cur.id){
cur.pos=d.progress_ms+(t1-t0)/2;cur.at=now;cur.playing=d.is_playing;
newTrack(tr);
}else if(now>hold){
cur.pos=d.progress_ms+(t1-t0)/2;cur.at=now;cur.playing=d.is_playing;
}
paintPlay();
}
let pt;
async function poll(){
clearTimeout(pt);
const t0=performance.now();
const d=await sp("GET","me/player?additional_types=track",null,true);
if(d!==null)applyState(d.item?d:null,t0,performance.now());
pt=setTimeout(poll,d===null?3000:1200);
}
const kick=ms=>setTimeout(poll,ms);

function frame(){
if(cur.id){
const p=Math.min(pos(),cur.dur);
if(!seeking)$("fill").style.transform="scaleX("+(cur.dur?p/cur.dur:0)+")";
$("cur").textContent=fmt(p);
if(synced&&els.length){const i=findIndex(p);if(i!==active)setActive(i)}
}
requestAnimationFrame(frame);
}
async function cmd(method,path,body){const ok=await sp(method,path,body);kick(350);return ok}
$("pp").onclick=async()=>{
const w=!cur.playing;
cur.pos=pos();cur.at=performance.now();cur.playing=w;hold=cur.at+900;paintPlay();
const ok=await cmd("PUT",w?"me/player/play":"me/player/pause");
if(!ok){cur.playing=!w;paintPlay()}
};
$("next").onclick=()=>{cmd("POST","me/player/next");kick(900)};
$("prev").onclick=()=>{if(pos()>3000)seek(0);else{cmd("POST","me/player/previous");kick(900)}};
$("shuf").onclick=async()=>{
const s=!shuf;
const ok=await sp("PUT","me/player/shuffle?state="+s);
if(ok){shuf=s;hold=performance.now()+1500;paintShuf();toast(s?"Shuffle on":"Shuffle off")}
};
function seek(ms){
ms=Math.max(0,Math.min(cur.dur-300,Math.round(ms)));
cur.pos=ms;cur.at=performance.now();hold=cur.at+1200;
sp("PUT","me/player/seek?position_ms="+ms);
kick(500);
}
const bar=$("bar");
const ratio=e=>{const r=bar.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))};
bar.onpointerdown=e=>{if(!cur.id)return;seeking=true;bar.setPointerCapture(e.pointerId);$("fill").style.transform="scaleX("+ratio(e)+")"};
bar.onpointermove=e=>{if(seeking)$("fill").style.transform="scaleX("+ratio(e)+")"};
bar.onpointerup=e=>{if(!seeking)return;seeking=false;seek(ratio(e)*cur.dur)};

const lib=$("lib"),lbody=$("lbody");
function openLib(v,title,up){
view=v;
lib.classList.add("on");
$("lt").textContent=title;
$("lup").style.display=up?"":"none";
$("lact").textContent="";
lbody.textContent="";
lbody.scrollTop=0;
}
function closeLib(){lib.classList.remove("on");view=""}
$("lback").onclick=closeLib;
$("lup").onclick=openPlaylists;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLib()});
const small=t=>{const a=(t.album&&t.album.images)||[];return(a[a.length-1]||{}).url||""};
const names=t=>(t.artists||[]).map(a=>a.name).join(", ");
function ibtn(txt,label,fn){const b=h("button","ib",txt);b.setAttribute("aria-label",label);b.onclick=e=>{e.stopPropagation();fn()};return b}
function trow(t,main,extra){
const r=h("div","row"+(t.id===cur.id?" cur":""));
const i=h("img");i.src=small(t);i.alt="";i.loading="lazy";
const m=h("div","rm");m.append(h("b","",t.name),h("span","",names(t)));
r.append(i,m);
(extra||[]).forEach(b=>r.appendChild(b));
r.onclick=main;
return r;
}
async function playNow(body){
const ok=await sp("PUT","me/player/play",body);
if(ok){closeLib();kick(400);kick(1200)}
}
async function addQ(t){
const ok=await sp("POST","me/player/queue?uri="+encodeURIComponent(t.uri));
if(ok)toast("Added to queue");
}
async function openPlaylists(){
openLib("pl","Your Playlists");
lbody.appendChild(h("div","emp","Loading…"));
const d=await sp("GET","me/playlists?limit=50");
if(view!=="pl")return;
lbody.textContent="";
const items=(d&&d.items||[]).filter(Boolean);
if(!items.length){lbody.appendChild(h("div","emp","No playlists found."));return}
const g=h("div","cards");
items.forEach(p=>{
const c=h("div","card");
const u=(p.images&&p.images[0]||{}).url;
if(u){const i=h("img");i.src=u;i.alt="";i.loading="lazy";c.appendChild(i)}else c.appendChild(h("div","ph"));
c.append(h("b","",p.name),h("span","",((p.items||p.tracks||{}).total||0)+" songs"));
c.onclick=()=>openPlaylist(p);
g.appendChild(c);
});
lbody.appendChild(g);
}
async function openPlaylist(p){
openLib("pd",p.name,true);
lbody.appendChild(h("div","emp","Loading…"));
let d=await sp("GET","playlists/"+p.id+"/items?limit=100",null,true);
if(!d)d=await sp("GET","playlists/"+p.id+"/tracks?limit=100");
if(view!=="pd")return;
lbody.textContent="";
const ts=((d&&d.items)||[]).map(x=>x&&(x.item||x.track)).filter(t=>t&&t.uri&&t.type!=="episode");
if(!ts.length){lbody.appendChild(h("div","emp","No playable songs here."));return}
const pl=h("button","",""),sh=h("button","","Shuffle");
pl.textContent="Play";
pl.onclick=()=>playNow({context_uri:p.uri});
sh.onclick=async()=>{await sp("PUT","me/player/shuffle?state=true");shuf=true;paintShuf();playNow({context_uri:p.uri})};
$("lact").append(pl," ",sh);
ts.forEach(t=>lbody.appendChild(trow(t,()=>playNow({context_uri:p.uri,offset:{uri:t.uri}}),[ibtn("+","Add to queue",()=>addQ(t))])));
}
let sT;
async function runSearch(){
const q=$("q").value.trim();
if(!q)return;
openLib("s","Results for “"+q+"”");
lbody.appendChild(h("div","emp","Searching…"));
const d=await sp("GET","search?type=track&limit=10&q="+encodeURIComponent(q));
if(view!=="s")return;
lbody.textContent="";
const ts=(d&&d.tracks&&d.tracks.items||[]).filter(Boolean);
if(!ts.length){lbody.appendChild(h("div","emp","Nothing found."));return}
ts.forEach(t=>lbody.appendChild(trow(t,()=>playNow({uris:[t.uri]}),[ibtn("+","Add to queue",()=>addQ(t))])));
}
$("q").oninput=()=>{clearTimeout(sT);sT=setTimeout(runSearch,450)};
$("q").onkeydown=e=>{if(e.key==="Enter"){clearTimeout(sT);runSearch()}};
$("bpl").onclick=openPlaylists;
let cT;
function commit(){
clearTimeout(cT);
cT=setTimeout(async()=>{
if(!cur.tr)return;
const ok=await sp("PUT","me/player/play",{uris:[cur.tr.uri].concat(uq.map(t=>t.uri)).slice(0,100),position_ms:Math.round(pos())});
if(ok)kick(500);
},700);
}
function renderQueue(){
lbody.textContent="";
if(cur.tr){lbody.appendChild(h("div","sec","Now Playing"));lbody.appendChild(trow(cur.tr,closeLib))}
lbody.appendChild(h("div","sec","Up Next · drag to reorder"));
if(!uq.length)lbody.appendChild(h("div","emp","Nothing queued. Search for a song and tap +."));
uq.forEach((t,i)=>{
const r=trow(t,()=>playNow({uris:uq.slice(i).map(x=>x.uri).slice(0,100)}),[
ibtn("▲","Move up",()=>{if(i>0){uq.splice(i-1,0,uq.splice(i,1)[0]);renderQueue();commit()}}),
ibtn("✕","Remove",()=>{uq.splice(i,1);renderQueue();commit()})
]);
r.draggable=true;
r.ondragstart=e=>{dragI=i;e.dataTransfer.effectAllowed="move"};
r.ondragover=e=>e.preventDefault();
r.ondrop=e=>{e.preventDefault();if(dragI===null||dragI===i)return;uq.splice(i,0,uq.splice(dragI,1)[0]);dragI=null;renderQueue();commit()};
lbody.appendChild(r);
});
}
async function openQueue(){
const fresh=view!=="queue";
if(fresh)openLib("queue","Queue");
const d=await sp("GET","me/player/queue",null,true);
if(view!=="queue")return;
uq=((d&&d.queue)||[]).filter(t=>t&&t.uri&&t.type!=="episode");
if(fresh){const c=h("button","","Clear");c.onclick=()=>{uq=[];renderQueue();commit()};$("lact").appendChild(c)}
renderQueue();
}
$("bq").onclick=openQueue;

(async function init(){
const p=new URLSearchParams(location.search);
if(p.get("code")){
const v=st.get("sy_v");
history.replaceState({},"",RU);
if(v){try{await tokReq({grant_type:"authorization_code",code:p.get("code"),redirect_uri:RU,client_id:CID,code_verifier:v})}catch(e){}st.del("sy_v")}
}else if(p.get("error"))history.replaceState({},"",RU);
if(await token()){$("login").style.display="none";$("app").style.display="grid";requestAnimationFrame(frame);poll()}
})();
</script>
