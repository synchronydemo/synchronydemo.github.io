<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synchrony</title>
<style>
@property --c1{syntax:"<color>";inherits:true;initial-value:#2a2a2a}
@property --c2{syntax:"<color>";inherits:true;initial-value:#555}
@property --c3{syntax:"<color>";inherits:true;initial-value:#000}
:root{--bg:#000;--fg:#fff;--mid:rgba(255,255,255,.6);--line:rgba(255,255,255,.18);--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--fg);padding:16px 34px;border-radius:999px;cursor:pointer;transition:background .3s var(--ease),color .3s var(--ease),transform .4s var(--ease),box-shadow .5s var(--ease)}
button:hover,button:focus-visible{background:var(--fg);color:var(--bg);outline:none}
button:disabled{opacity:.5;pointer-events:none}
button.link{border:0;padding:2px;border-radius:4px;background:none;color:var(--mid);font-size:15px;text-decoration:underline;text-underline-offset:5px}
button.link:hover,button.link:focus-visible{background:none;color:var(--fg)}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,var(--c3) 0%,var(--c1) 55%,var(--c3) 100%);transition:--c1 1.6s,--c2 1.6s,--c3 1.6s}
#bg b{position:absolute;width:75vmax;height:75vmax;border-radius:50%;background:radial-gradient(closest-side,var(--c2),transparent);opacity:.3;animation:drift 26s ease-in-out infinite alternate}
#bg b:nth-child(1){left:30%;top:-30%}
#bg b:nth-child(2){left:-25%;top:35%;animation-duration:34s;animation-delay:-9s}
#bg b:nth-child(3){left:55%;top:40%;animation-duration:30s;animation-delay:-17s;opacity:.22}
@keyframes drift{to{transform:translate(12vmax,-9vmax) scale(1.15)}}
#pulse{position:absolute;left:-18vmax;top:50%;width:70vmax;height:70vmax;margin-top:-35vmax;border-radius:50%;background:radial-gradient(closest-side,var(--c2),transparent);opacity:.25}
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(10px)}}
#login{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;padding:24px}
#login>*{animation:rise 1.2s var(--ease) backwards}
#login>:nth-child(2){animation-delay:.1s}
#login>:nth-child(3){animation-delay:.2s}
#login>:nth-child(4){animation-delay:.3s;margin-top:-14px}
#login h1{font-size:clamp(48px,11vw,128px);font-weight:700;letter-spacing:-.05em;line-height:.9}
#login p{color:var(--mid);font-size:16px;max-width:36ch;line-height:1.5}
#join{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:24px}
#join.on{display:flex;animation:rise .6s var(--ease)}
#join .card{width:min(100%,360px);display:flex;flex-direction:column;gap:16px;text-align:center}
#join h2{font-size:30px;letter-spacing:-.03em}
#join p{color:var(--mid);font-size:14px;line-height:1.5}
#code{background:none;border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:16px 16px 16px calc(16px + .4em);font:inherit;font-size:28px;font-weight:700;letter-spacing:.4em;text-align:center;text-transform:uppercase;outline:none;transition:border-color .3s}
#code:focus{border-color:var(--fg)}
#jerr{color:#ff9b9b;font-size:13px;min-height:16px}
#app{display:none;position:relative;z-index:1;height:100%;grid-template-columns:minmax(320px,440px) 1fr;gap:clamp(24px,5vw,80px);padding:72px clamp(20px,4vw,56px) 32px}
.brand{position:absolute;top:clamp(20px,3vw,36px);left:clamp(20px,4vw,56px);font-weight:700;letter-spacing:-.03em;font-size:18px}
.party{position:absolute;top:clamp(14px,2.6vw,30px);right:clamp(20px,4vw,56px);display:none;align-items:center;gap:10px;font-size:12px;color:var(--mid);z-index:2}
.party button{padding:6px 14px;font-size:12px;border-color:var(--line)}
#pcode{letter-spacing:.2em;margin-left:6px}
#player{display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
#player>*{animation:rise 1.1s var(--ease) backwards}
#player>:nth-child(2){animation-delay:.06s}
#player>:nth-child(3){animation-delay:.12s}
#player>:nth-child(4){animation-delay:.18s}
#player>:nth-child(5){animation-delay:.24s}
.artwrap{position:relative;width:min(100%,max(160px,calc((100dvh - 400px)*1.12)))}
#glow{position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(closest-side,var(--c2),transparent);opacity:.3;pointer-events:none;animation:breathe 6s ease-in-out infinite alternate}
.artwrap.paused #glow{animation-play-state:paused}
@keyframes breathe{to{opacity:.55;transform:scale(1.08)}}
.deck{position:relative;z-index:1;aspect-ratio:100/89.3;border-radius:clamp(12px,1.6vw,22px);background:linear-gradient(155deg,#1f1f23 0%,#0e0e10 60%,#161618 100%);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 6px rgba(0,0,0,.6)}
.deck::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
.plat{position:absolute;left:2.5%;top:50%;width:80%;aspect-ratio:1;margin-top:-40%;border-radius:50%;background:repeating-conic-gradient(#b9b9bd 0 7deg,#1a1a1c 7deg 30deg);box-shadow:0 0 0 1px rgba(0,0,0,.8),0 8px 22px rgba(0,0,0,.65);will-change:transform}
.plat::after{content:"";position:absolute;inset:5.5%;border-radius:50%;background:#1b1b1e;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.vinyl{position:absolute;inset:auto;left:4.5%;top:50%;width:76%;aspect-ratio:1;margin-top:-38%;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.6);transition:transform 1.2s var(--ease)}
.vinyl.paused{transform:scale(.95)}
.disc{position:absolute;inset:0;border-radius:50%;will-change:transform;background:repeating-radial-gradient(circle at 50% 50%,#0a0a0a 0,#0a0a0a 1.5px,#191919 2px,#0a0a0a 3.2px);box-shadow:inset 0 0 0 2px #222,inset 0 0 0 7px #060606}
.disc::before{content:"";position:absolute;inset:23%;border-radius:50%;background:#0b0b0b;box-shadow:0 0 0 1px #1d1d1d}
.label{position:absolute;inset:27%;border-radius:50%;overflow:hidden;background:#111}
.label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;will-change:transform,opacity}
.hole{position:absolute;left:50%;top:50%;width:4.5%;height:4.5%;transform:translate(-50%,-50%);border-radius:50%;background:#050505;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:conic-gradient(from 35deg,transparent 0 6%,rgba(255,255,255,.17) 12%,transparent 20% 52%,rgba(255,255,255,.12) 60%,transparent 68%)}
.spindle{position:absolute;left:40.9%;top:50%;width:3.2%;aspect-ratio:1;margin-top:-1.6%;border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 30%,#fff,#9a9aa0 45%,#3b3b40);box-shadow:0 1px 3px rgba(0,0,0,.7)}
.pknob{position:absolute;left:5%;bottom:6.5%;width:7%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4a50,#18181b 75%);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 3px 6px rgba(0,0,0,.7);transition:transform .9s var(--ease)}
.pknob::after{content:"";position:absolute;left:46%;top:10%;width:8%;height:30%;border-radius:2px;background:#fff}
.pknob.on{transform:rotate(70deg)}
.led{position:absolute;right:6%;bottom:7%;width:2.4%;aspect-ratio:1;border-radius:50%;background:#3a1414;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);transition:background .5s,box-shadow .5s}
.led.on{background:#ff4a3d;box-shadow:0 0 8px 2px rgba(255,74,61,.8)}
.tone{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.meta{min-width:0}
#title{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:var(--mid);margin-top:4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{width:100%}
.bar{position:relative;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline:none}
.trk{position:absolute;left:0;right:0;height:3px;background:var(--line);border-radius:3px;overflow:hidden;transition:height .4s var(--ease)}
.bar:hover .trk,.bar.drag .trk,.bar:focus-visible .trk{height:6px}
#fill{height:100%;background:var(--fg);transform-origin:left;transform:scaleX(0);will-change:transform}
#fill.glide{transition:transform .8s var(--ease)}
#knob{position:absolute;left:0;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;opacity:0;transform:scale(.4);transition:opacity .3s,transform .4s var(--ease)}
.bar:hover #knob,.bar.drag #knob,.bar:focus-visible #knob{opacity:1;transform:scale(1)}
.times{display:flex;justify-content:space-between;color:var(--mid);font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.ctls{display:flex;justify-content:center;align-items:center;gap:22px}
.ctl{padding:0;width:48px;height:48px;border-color:transparent;display:grid;place-items:center}
.ctl svg{display:block}
.ctl.big{position:relative;width:64px;height:64px;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ctl.big:hover{transform:scale(1.08);box-shadow:0 0 44px rgba(255,255,255,.35)}
.ctl.big svg{position:absolute;top:50%;left:50%;margin:-15px 0 0 -15px;transition:opacity .35s var(--ease),transform .7s var(--ease)}
#pp[data-state=playing] .i-play{opacity:0;transform:scale(.3) rotate(-90deg)}
#pp[data-state=paused] .i-pause{opacity:0;transform:scale(.3) rotate(90deg)}
.ctl:active{transform:scale(.92)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--mid);font-size:12px}
.tools button{padding:5px 11px;font-size:12px;border-color:var(--line)}
#off{min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
#tempo{margin-left:12px;font-variant-numeric:tabular-nums}
#lyrics{position:relative;overflow:hidden}
#lm{position:absolute;inset:0;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#singer{position:absolute;top:clamp(6px,3.5vh,28px);left:24px;z-index:3;display:none;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:15px;font-weight:600;color:#fff;pointer-events:none}
#singer.on{display:flex}
#sdot{width:9px;height:9px;border-radius:50%;background:#fff;transition:background .6s}
#stage{position:absolute;inset:0;overflow:hidden;will-change:transform,opacity,filter}
#stage.plain{overflow-y:auto;scrollbar-width:none;padding:12% 0}
#track{position:absolute;left:0;right:0;top:0;padding:0 24px;will-change:transform;transition:transform .9s var(--ease)}
#stage.plain #track{position:relative;transform:none!important;transition:none}
.l{font-size:clamp(26px,3.6vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.12;padding:.34em 0;opacity:.2;filter:blur(1.5px);transform:scale(.94) translateX(-6px);transform-origin:left center;transition:opacity .6s var(--ease),filter .6s var(--ease),transform .9s var(--ease);overflow-wrap:anywhere}
.l.n{opacity:.4;filter:blur(.6px)}
.l.a{opacity:1;filter:none;transform:scale(1)}
.l.p{opacity:.5;filter:none;transform:scale(.97)}
#stage.plain .l{font-size:clamp(20px,2.4vw,30px);opacity:.85;filter:none;transform:none;padding:.18em 0}
.tag{color:var(--mid);font-size:14px;margin-bottom:18px}
.l{--hi:#fff;--lo:rgba(255,255,255,.42)}
.tx{display:block;--p:var(--lp,100);color:transparent;background:linear-gradient(to bottom,var(--hi) calc(var(--p)*1.1% - 10%),var(--lo) calc(var(--p)*1.1%));-webkit-background-clip:text;background-clip:text}
#stage.sy .l{cursor:pointer}
#stage.sy .l:not(.a):hover{opacity:.7;filter:none}
#note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px;font-size:clamp(22px,3vw,40px);font-weight:700;letter-spacing:-.03em;color:var(--mid);pointer-events:none;transition:opacity .5s var(--ease);z-index:2}
#note button{pointer-events:auto;font-size:14px;font-weight:400;letter-spacing:0;padding:10px 20px}
.msr{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}
.msr input{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;letter-spacing:0;font-weight:400;outline:none;min-width:200px}
.msr input:focus{border-color:var(--fg)}
#idle{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--mid);text-align:center;z-index:3;font-size:18px;padding:24px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:#000;border:1px solid var(--line);padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .4s var(--ease),transform .5s var(--ease);z-index:7;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:12px;padding:60px 20px 16px}
#player{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 16px}
.artwrap{width:136px;flex:none}
.label{inset:25%}
#glow{inset:-12%}
.meta{flex:1}
#title{font-size:20px}
.prog,.ctls{flex-basis:100%}
.tools{display:none}
#pulse{left:50%;margin-left:-35vmax;top:0;margin-top:-25vmax}
}
@media (prefers-reduced-motion:reduce){#track,.l,.vinyl,#bg b,#glow,.pknob{transition:none;animation:none}}
</style>
</head>
<body>
<div id="bg"><b></b><b></b><b></b><div id="pulse"></div></div>
<div id="login">
<h1>Synchrony</h1>
<p>Live lyrics and playback controls for whatever you’re playing on Spotify.</p>
<button id="connect">Connect Spotify</button>
<button class="link" id="joinlink">join a party?</button>
</div>
<div id="join" role="dialog" aria-modal="true" aria-label="Join a party"><div class="card">
<h2>Join a party</h2>
<p>Enter the code shown on the host’s player. No Spotify account needed.</p>
<input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="•••••" aria-label="Party code">
<div id="jerr"></div>
<button id="go">Join</button>
<button class="link" id="jx">Cancel</button>
</div></div>
<div id="app">
<div class="brand">Synchrony</div>
<div class="party" id="party"><span id="pcount"></span><button id="pcopy" title="Copy code"><span id="plabel">Party code</span><b id="pcode"></b></button><button id="leave">Leave</button></div>
<section id="player">
<div class="artwrap paused" id="wrap"><div id="glow"></div>
<div class="deck" id="deck">
<div class="plat" id="plat"></div>
<div class="vinyl paused" id="vinyl">
<div class="disc" id="disc"><div class="label"><img id="art" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><img id="art2" alt="" style="opacity:0" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div><div class="hole"></div></div>
<div class="sheen"></div>
</div>
<div class="spindle"></div>
<i class="pknob" id="pknob"></i>
<i class="led" id="led"></i>
<svg class="tone" viewBox="0 0 100 89.3" preserveAspectRatio="none" aria-hidden="true">
<defs>
<linearGradient id="gTube" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#6d6d73"/><stop offset=".45" stop-color="#ececf1"/><stop offset="1" stop-color="#5a5a60"/></linearGradient>
<radialGradient id="gPivot" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8e8e95"/><stop offset="1" stop-color="#232326"/></radialGradient>
<filter id="fShadow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="130" height="120"><feDropShadow dx=".5" dy="1.4" stdDeviation=".9" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<rect x="86.8" y="60.5" width="6.4" height="4" rx="1.4" fill="#2a2a2e" stroke="#fff" stroke-opacity=".18" stroke-width=".2"/>
<circle cx="90" cy="16" r="7" fill="#111113" stroke="#fff" stroke-opacity=".14" stroke-width=".25"/>
<circle cx="90" cy="16" r="5" fill="url(#gPivot)"/>
<g filter="url(#fShadow)"><g id="arm" transform="rotate(0 90 16)">
<rect x="87.5" y="6" width="5" height="6.4" rx="1" fill="#2c2c30" stroke="#55555b" stroke-width=".2"/>
<rect x="89.15" y="11" width="1.7" height="57" fill="url(#gTube)"/>
<circle cx="90" cy="16" r="3.2" fill="#18181a" stroke="#6a6a70" stroke-width=".3"/>
<path d="M88.1 67.4 L91.9 67.4 L91.3 72.6 L88.7 72.6 Z" fill="#1b1b1e" stroke="#6a6a70" stroke-width=".25"/>
<path d="M91.9 68 L94.3 70.6" stroke="#9a9aa0" stroke-width=".5" stroke-linecap="round"/>
<rect x="88.9" y="72.4" width="2.2" height="1.1" fill="#d9d9de"/>
</g></g>

</div></div>
<div class="meta"><div id="title">Nothing playing</div><div id="artist">Press play in Spotify</div></div>

<div class="ctls">
<button class="ctl" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>

<div class="tools"><span>Sync</span><button id="minus" aria-label="Earlier">−50</button><span id="off">0 ms</span><button id="plus" aria-label="Later">+50</button><span id="tempo"></span></div>

<section id="lyrics"><div id="singer"><i id="sdot"></i><span id="sname"></span></div><div id="lm"><div id="idle">Open Spotify and play a song.</div><div id="note"></div><div id="stage"><div id="track"></div></div></div></section>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const CLIENT_ID="a199a4190b6542aa8ea7605253c9b931";
const REDIRECT=location.origin+location.pathname;
const SCOPE="user-read-currently-playing user-read-playback-state user-modify-playback-state";
const EASE="cubic-bezier(.16,1,.3,1)";
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const rand=n=>b64(crypto.getRandomValues(new Uint8Array(n)));

async function login(){
const verifier=rand(64);
const challenge=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
store.set("sy_v",verifier);
location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,scope:SCOPE,code_challenge_method:"S256",code_challenge:challenge});
}
async function tokenRequest(body){
const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
if(!r.ok)throw new Error("token");
const d=await r.json();
store.set("sy_at",d.access_token);
store.set("sy_exp",String(Date.now()+d.expires_in*1000-30000));
store.set("sy_scope",SCOPE);
if(d.refresh_token)store.set("sy_rt",d.refresh_token);
return d.access_token;
}
async function token(){
if(store.get("sy_scope")!==SCOPE){["sy_at","sy_exp","sy_rt"].forEach(store.del);return null}
const at=store.get("sy_at");
if(at&&Date.now()<Number(store.get("sy_exp")))return at;

function parseLRC(t){

for(const raw of t.split("\n")){
const m=raw.match(/^((?:\[\d+:\d+(?:[.:]\d+)?\])+)\s*(.*)$/);
if(!m)continue;
const text=m[2].trim();
for(const tm of m[1].matchAll(/\[(\d+):(\d+)(?:[.:](\d+))?\]/g)){
const frac=tm[3]?Number("0."+tm[3]):0;
out.push({t:(Number(tm[1])*60+Number(tm[2])+frac)*1000,s:text});
}
}
return out.sort((a,b)=>a.t-b.t);
}

async function findLyrics(tr,hi){

const res=await Promise.allSettled(calls);

return f.flatMap(r=>Array.isArray(r.value)?r.value:r.value?[r.value]:[]);
};

let best=null,bs=-1;
for(const c of pool){const s=score(c,tr,cname,dur);if(s>bs){bs=s;best=c}}
if(!best&&pool.some(c=>c.instrumental&&score(c,tr,cname,dur,1)>=0))ins=true;
return best;
};
const first=[L("get",{artist_name:artist,track_name:name,album_name:album,duration:d})];
if(cname!==name)first.push(L("get",{artist_name:artist,track_name:cname,album_name:album,duration:d}));

let best=pick(await run(first));

try{
const r=await fetch("https://api.lyrics.ovh/v1/"+encodeURIComponent(artist)+"/"+encodeURIComponent(cname));
ok++;
if(r.ok){
const j=await r.json();
const t=j.lyrics&&j.lyrics.replace(/\r/g,"").replace(/^Paroles de la chanson.*\n/i,"").trim();

}
}catch(e){}
try{const g=await genius(artist+" "+cname,artist,cname);if(g)return{plainLyrics:g,src:"Genius"}}catch(e){}
if(ins)return{instrumental:true};
if(!ok)throw new Error("net");

}

const ARM={x:90,y:16,L:57.5,cx:42.5,cy:44.65};
function armFor(r){
const dx=ARM.cx-ARM.x,dy=ARM.cy-ARM.y,d=Math.hypot(dx,dy);
const a=Math.acos((ARM.L*ARM.L+d*d-r*r)/(2*ARM.L*d));
return(Math.atan2(-dx,dy)-a)*180/Math.PI;
}
const A0=armFor(34.5),A1=armFor(20.5);
let ang=0,vel=0,lastT=performance.now(),spdF=1,fdt=.016,armA=0,armV=null;
function spin(now){
const dt=Math.min(.1,(now-lastT)/1000);lastT=now;fdt=dt;
spdF+=(tempoFactor()-spdF)*(1-Math.exp(-dt/.8));
const target=cur.playing&&cur.id&&!RM?200*spdF:0;
vel+=(target-vel)*(1-Math.exp(-dt/(target>vel?.7:1.8)));
if(!target&&vel<.1)vel=0;
ang=(ang+vel*dt)%360;
const r="rotate("+ang.toFixed(2)+"deg)";
disc.style.transform=r;
plat.style.transform=r;
}
function moveArm(ratio){
const on=cur.playing&&cur.id;
const tgt=on?A0+(A1-A0)*ratio:0;
armA=RM?tgt:armA+(tgt-armA)*(1-Math.exp(-fdt/(on?.35:.6)));
if(Math.abs(tgt-armA)<.01)armA=tgt;
const v=Math.round(armA*40)/40;
if(v!==armV){armV=v;armEl.setAttribute("transform","rotate("+v+" 90 16)")}
}
function frame(){
const t=performance.now();
spin(t);
const real=pos();
const shown=seeking?seekRatio*cur.dur:real;
moveArm(cur.dur?Math.min(1,Math.max(0,shown/cur.dur)):0);
if(synced&&els.length){
const i=findIndex(shown+offset);
if(i!==active)setActive(i);
tick(shown+offset);
}
if(cur.id){
const p=Math.min(shown,cur.dur),r=cur.dur?p/cur.dur:0;
$("fill").style.transform="scaleX("+r+")";
$("knob").style.left=r*100+"%";
const s=Math.floor(p/1000);
if(s!==lastSec){lastSec=s;$("cur").textContent=fmt(p)}
if(role==="host"&&cur.playing&&!endPolled&&cur.dur&&real>=cur.dur-30){endPolled=true;setTimeout(poll,120)}
}
requestAnimationFrame(frame);
}
let framing=false;
function startFrame(){if(!framing){framing=true;requestAnimationFrame(frame)}}

function setPlayingUI(){
$("pp").dataset.state=cur.playing?"playing":"paused";
$("pp").setAttribute("aria-label",cur.playing?"Pause":"Play");
$("vinyl").classList.toggle("paused",!cur.playing);
$("wrap").classList.toggle("paused",!cur.playing);
$("led").classList.toggle("on",!!cur.playing);
$("pknob").classList.toggle("on",!!cur.playing);
}
async function swapText(el,text,dir,delay){
const id=(el._id=(el._id||0)+1);
if(el.dataset.ready){
await el.animate([{opacity:1,transform:"none",filter:"blur(0px)"},{opacity:0,transform:"translateX("+(-dir*22)+"px)",filter:"blur(6px)"}],{duration:260,delay,easing:"cubic-bezier(.4,0,1,1)",fill:"forwards"}).finished.catch(()=>{});
}
if(el._id!==id)return;
el.getAnimations().forEach(a=>a.cancel());
el.textContent=text;
el.dataset.ready="1";
el.animate([{opacity:0,transform:"translateX("+(dir*22)+"px)",filter:"blur(6px)"},{opacity:1,transform:"none",filter:"blur(0px)"}],{duration:800,easing:EASE});
}
async function swapArt(src,dir){
if(!src)return;
const tok=++artTok;
[front,back].forEach(el=>el.getAnimations().forEach(a=>a.finish()));
back.src=src;
try{await back.decode()}catch(e){}
if(tok!==artTok)return;
const a=front,b=back;
front=b;back=a;
b.style.zIndex=2;a.style.zIndex=1;b.style.opacity=1;
b.animate([{opacity:0,transform:"translateX("+(dir*56)+"px) scale(1.06)",filter:"blur(12px)"},{opacity:1,transform:"none",filter:"blur(0px)"}],{duration:1000,easing:EASE});
const out=a.animate([{opacity:1,transform:"none",filter:"blur(0px)"},{opacity:0,transform:"translateX("+(-dir*56)+"px) scale(.94)",filter:"blur(12px)"}],{duration:750,easing:EASE,fill:"forwards"});
out.finished.then(()=>{a.style.opacity=0;out.cancel()}).catch(()=>{});
}
function flash(){
$("pulse").animate([{opacity:.25,transform:"scale(1)"},{opacity:.85,transform:"scale(1.3)",offset:.25},{opacity:.25,transform:"scale(1)"}],{duration:1600,easing:EASE});
}
function onTrack(v,playing,anchor,dir){
cur={id:v.id,dur:v.dur,playing,pos:anchor,at:performance.now(),tr:null};
mainArtist=v.artist.split(", ")[0];
endPolled=false;hold=0;lastSec=-1;
setTempo(null);
swapText($("title"),v.name,dir,0);
swapText($("artist"),v.artist,dir,70);
$("dur").textContent=fmt(v.dur);
document.title=v.name+" · Synchrony";
swapArt(v.art,dir);
themeFrom(v.art);
$("fill").classList.add("glide");
setTimeout(()=>$("fill").classList.remove("glide"),900);
flash();
}

function applyState(d,t0,t1){
const idle=$("idle");
if(!d||!d.item||d.currently_playing_type==="ad"){
idle.style.display="flex";
cur.playing=false;
setPlayingUI();
send({type:"idle"});
return;
}
idle.style.display="none";
const tr=d.item,anchor=d.progress_ms+(t1-t0)/2,now=performance.now();
if(tr.id!==cur.id){
const dir=fxDir;
fxDir=1;curLy=null;curWho=null;
lastV={id:tr.id,name:tr.name,artist:tr.artists.map(a=>a.name).join(", "),art:(tr.album.images[0]||{}).url,dur:tr.duration_ms};
lastDir=dir;
onTrack(lastV,d.is_playing,anchor,dir);
cur.tr=tr;
loadTrack(tr,dir);
send(trackMsg());
}else if(now>=hold){
const predicted=cur.playing?cur.pos+(now-cur.at):cur.pos;
const diff=anchor-predicted;
if(!d.is_playing||!cur.playing||Math.abs(diff)>250){cur.pos=anchor;cur.at=now}
else{cur.pos=predicted+diff*.25;cur.at=now}
cur.playing=d.is_playing;
if(cur.dur-anchor>400)endPolled=false;
}
setPlayingUI();
sendPos();
}
let polling=false,timer=null;
async function poll(){
if(role!=="host"||polling)return;
polling=true;
clearTimeout(timer);
let wait=1000;
try{
const at=await token();
if(!at){showLogin();polling=false;return}
const t0=performance.now();
const r=await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=track",{headers:{Authorization:"Bearer "+at},cache:"no-store"});
const t1=performance.now();
if(r.status===204)applyState(null);
else if(r.status===429)wait=(Number(r.headers.get("Retry-After"))||5)*1000;
else if(r.status===401){store.del("sy_at");store.del("sy_exp");wait=200}
else if(r.ok)applyState(await r.json(),t0,t1);
else wait=3000;
}catch(e){wait=2000}
polling=false;
timer=setTimeout(poll,wait);
}
const kick=ms=>setTimeout(poll,ms);
async function api(method,path,params){
const at=await token();
if(!at){showLogin();return false}
try{
const r=await fetch("https://api.spotify.com/v1/me/player/"+path+(params?"?"+new URLSearchParams(params):""),{method,headers:{Authorization:"Bearer "+at}});
if(r.ok)return true;
if(r.status===401){store.del("sy_at");store.del("sy_exp")}
else if(r.status===403)toast("Playback controls need Spotify Premium.");
else if(r.status===404)toast("No active device. Press play in Spotify first.");
else if(r.status===429)toast("Too many requests. Try again in a moment.");
else toast("Spotify couldn’t do that. Try again.");
}catch(e){toast("Connection problem. Try again.")}
return false;
}

async function setPlaying(want){
const was=cur.playing,now=performance.now();
if(want===was&&cur.id)return;
if(cur.id){cur.pos=pos();cur.at=now;cur.playing=want;hold=now+900;setPlayingUI();sendPos()}
const ok=await api("PUT",want?"play":"pause");
if(!ok&&cur.id){cur.pos=pos();cur.at=performance.now();cur.playing=was;hold=0;setPlayingUI();sendPos()}
kick(350);
}
$("pp").onclick=()=>{
if(role==="guest"){
const now=performance.now(),w=!cur.playing;
if(cur.id){cur.pos=pos();cur.at=now;cur.playing=w;hold=now+1500;setPlayingUI()}
sendHost({type:"cmd",a:"set",playing:w});
return;
}
setPlaying(!cur.playing);
};
function skipFx(dir){
const btn=dir>0?$("next"):$("prev");
btn.querySelector("svg").animate([{transform:"translateX(0)"},{transform:"translateX("+(dir*10)+"px)",offset:.3},{transform:"translateX(0)"}],{duration:650,easing:"cubic-bezier(.34,1.56,.64,1)"});
btn.animate([{transform:"scale(1)"},{transform:"scale(.84)",offset:.25},{transform:"scale(1)"}],{duration:560,easing:"cubic-bezier(.34,1.56,.64,1)"});
}
async function skip(dir){
skipFx(dir);
if(role==="guest"){sendHost({type:"cmd",a:dir>0?"next":"prev"});return}
if(dir<0&&pos()>3000){doSeek(0);return}
const id=cur.id;
fxDir=dir;
stageOut(dir);
const ok=await api("POST",dir>0?"next":"previous");
if(!ok){fxDir=1;restoreStage();return}
kick(250);kick(800);kick(1600);
setTimeout(()=>{if(cur.id===id&&stageAnim)restoreStage()},4500);
}
$("next").onclick=()=>skip(1);
$("prev").onclick=()=>skip(-1);
function ratioFrom(e){const r=bar.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}
function doSeek(ms){
ms=Math.max(0,Math.min(cur.dur-300,Math.round(ms)));
cur.pos=ms;cur.at=performance.now();hold=cur.at+1200;endPolled=false;lastSec=-1;
if(role==="guest"){hold=cur.at+1500;sendHost({type:"cmd",a:"seek",ms});return}
api("PUT","seek",{position_ms:ms});
sendPos();
kick(500);
}
bar.addEventListener("pointerdown",e=>{if(!cur.id)return;seeking=true;seekRatio=ratioFrom(e);bar.setPointerCapture(e.pointerId);bar.classList.add("drag")});
bar.addEventListener("pointermove",e=>{if(seeking)seekRatio=ratioFrom(e)});
bar.addEventListener("pointerup",()=>{if(!seeking)return;seeking=false;bar.classList.remove("drag");doSeek(seekRatio*cur.dur)});
bar.addEventListener("pointercancel",()=>{seeking=false;bar.classList.remove("drag")});
bar.addEventListener("keydown",e=>{
if(!cur.id)return;
if(e.key==="ArrowRight"){e.preventDefault();doSeek(pos()+5000)}
if(e.key==="ArrowLeft"){e.preventDefault();doSeek(pos()-5000)}
});

const PREFIX="synchrony-",ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>ALPHA[b%ALPHA.length]).join("");
let peer=null,hostConn=null,partyCode=null,leaving=false;
const conns=new Set();
const send=m=>{conns.forEach(c=>{if(c.open)try{c.send(m)}catch(e){}})};
const sendHost=m=>{if(hostConn&&hostConn.open)try{hostConn.send(m)}catch(e){}};
const posMsg=()=>({type:"pos",id:cur.id,pos:pos(),playing:cur.playing});
const trackMsg=()=>({type:"track",...lastV,pos:pos(),playing:cur.playing,dir:lastDir,ly:curLy,who:curWho&&curWho.who,main:curWho&&curWho.main,tempo});
const tempoMsg=()=>({type:"tempo",id:cur.id,tempo});
const sendPos=()=>{if(conns.size&&cur.id)send(posMsg())};

function updateParty(){
const p=$("party");
if(!role||!partyCode){p.style.display="none";return}
p.style.display="flex";
$("pcode").textContent=partyCode;
if(role==="host"){
$("plabel").textContent="Party code";
$("pcount").textContent=conns.size?conns.size+" listening":"";
$("leave").style.display="none";
}else{
$("plabel").textContent="In party";
$("pcount").textContent="";
$("leave").style.display="";
}
}
function startHosting(n){
if(typeof Peer==="undefined")return;
const code=(!n&&store.get("sy_code"))||newCode();
const p=new Peer(PREFIX+code);
p.on("open",()=>{peer=p;partyCode=code;store.set("sy_code",code);updateParty()});
p.on("connection",c=>{
c.on("open",()=>{
conns.add(c);updateParty();
if(lastV&&cur.id){c.send(trackMsg());c.send(posMsg())}else c.send({type:"idle"});
});
c.on("data",onGuestCmd);
const drop=()=>{conns.delete(c);updateParty()};
c.on("close",drop);c.on("error",drop);
});
p.on("disconnected",()=>{try{p.reconnect()}catch(e){}});
p.on("error",e=>{if(e.type==="unavailable-id"&&(n||0)<5){try{p.destroy()}catch(x){}startHosting((n||0)+1)}});
}
function onGuestCmd(m){
if(!m||m.type!=="cmd")return;
if(m.a==="set")setPlaying(!!m.playing);
else if(m.a==="next")skip(1);
else if(m.a==="prev")skip(-1);
else if(m.a==="seek"&&typeof m.ms==="number")doSeek(m.ms);
}
function enterGuest(){
role="guest";
$("join").classList.remove("on");
$("idle").textContent="Waiting for the host to play something…";
$("idle").style.display="flex";
showApp();updateParty();startFrame();
}
function syncPos(m){
const now=performance.now();
if(now<hold)return;
const predicted=cur.playing?cur.pos+(now-cur.at):cur.pos;
const diff=m.pos-predicted;
if(!m.playing||!cur.playing||Math.abs(diff)>250){cur.pos=m.pos;cur.at=now}
else{cur.pos=predicted+diff*.25;cur.at=now}
cur.playing=m.playing;
setPlayingUI();
}
async function remoteTrack(m){
const dir=m.dir||1;
stageReady=false;
await stageOut(dir);
if(cur.id!==m.id)return;
build([],false,dir);
stageReady=true;
setNote("");
if(curLy)showLyrics(curLy,dir);else setNote("Finding lyrics…");
}
function onHostMsg(m){
if(!m||typeof m!=="object")return;
if(m.type==="idle"){$("idle").style.display="flex";cur.playing=false;setPlayingUI()}
else if(m.type==="track"){
$("idle").style.display="none";
if(m.id!==cur.id){
onTrack(m,m.playing,m.pos,m.dir||1);
if(m.tempo)setTempo(m.tempo);
curLy=m.ly||null;curWho=m.who?{who:m.who,main:m.main}:null;
remoteTrack(m);
setPlayingUI();
}else syncPos(m);
}else if(m.type==="ly"){
if(m.id===cur.id){curLy=m.ly;if(stageReady){setNote("");showLyrics(m.ly,1)}}
}else if(m.type==="who"){
if(m.id===cur.id&&m.who){curWho={who:m.who,main:m.main};if(stageReady)setWho(curWho)}
}else if(m.type==="tempo"){
if(m.id===cur.id&&m.tempo)setTempo(m.tempo);
}else if(m.type==="pos"){
if(m.id===cur.id)syncPos(m);
}
}
function joinParty(raw,silent){
const code=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,"");
const err=m=>{if(silent){store.del("sy_join");return}$("jerr").textContent=m;$("go").disabled=false};
if(code.length<4)return err("Enter the code shown on the host’s screen.");
if(typeof Peer==="undefined")return err("The party service didn’t load. Check your connection.");
$("go").disabled=true;
$("jerr").textContent=silent?"":"Connecting…";
const p=new Peer();
let opened=false;
const to=setTimeout(()=>{if(!opened){try{p.destroy()}catch(e){}err("Couldn’t reach that party. Check the code and try again.")}},12000);
p.on("open",()=>{
const c=p.connect(PREFIX+code,{reliable:true});
c.on("open",()=>{opened=true;clearTimeout(to);peer=p;hostConn=c;partyCode=code;store.set("sy_join",code);enterGuest()});
c.on("data",onHostMsg);
c.on("close",()=>{if(opened&&!leaving){toast("Party ended.");setTimeout(()=>location.reload(),1500)}});
});
p.on("error",e=>{clearTimeout(to);if(!opened)err(e.type==="peer-unavailable"?"No party found with that code.":"Connection problem. Try again.")});
}
$("joinlink").onclick=()=>{$("join").classList.add("on");$("jerr").textContent="";$("go").disabled=false;setTimeout(()=>$("code").focus(),50)};
$("jx").onclick=()=>$("join").classList.remove("on");
$("join").addEventListener("pointerdown",e=>{if(e.target===$("join"))$("join").classList.remove("on")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("join").classList.remove("on")});
$("go").onclick=()=>joinParty($("code").value);
$("code").onkeydown=e=>{if(e.key==="Enter")joinParty($("code").value)};
$("leave").onclick=()=>{leaving=true;store.del("sy_join");try{hostConn.close()}catch(e){}try{peer.destroy()}catch(e){}location.reload()};
$("pcopy").onclick=()=>{if(role==="host"&&partyCode&&navigator.clipboard)navigator.clipboard.writeText(partyCode).then(()=>toast("Party code copied"),()=>{})};

document.addEventListener("visibilitychange",()=>{if(!document.hidden&&role==="host")poll()});
window.addEventListener("resize",()=>{if(active>=0)center(active)});

(async function init(){
const params=new URLSearchParams(location.search);
if(params.get("code")){
const v=store.get("sy_v");
history.replaceState({},"",REDIRECT);
if(v){
try{await tokenRequest({grant_type:"authorization_code",code:params.get("code"),redirect_uri:REDIRECT,client_id:CLIENT_ID,code_verifier:v})}catch(e){}
store.del("sy_v");
}
}else if(params.get("error")){history.replaceState({},"",REDIRECT)}
if(await token()){role="host";showApp();startFrame();poll();startHosting()}
else{const j=store.get("sy_join");if(j)joinParty(j,true);else showLogin()}
})();
</script>
