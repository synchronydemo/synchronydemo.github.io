<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synchrony</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:rgba(255,255,255,.22);--mid:rgba(255,255,255,.5);--line:rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--fg);padding:16px 34px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
button:hover,button:focus-visible{background:var(--fg);color:var(--bg);outline:none}
#login{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;padding:24px}
#login h1{font-size:clamp(48px,11vw,128px);font-weight:700;letter-spacing:-.05em;line-height:.9}
#login p{color:var(--mid);font-size:16px;max-width:34ch;line-height:1.5}
#app{display:none;height:100%;grid-template-columns:minmax(320px,440px) 1fr;gap:clamp(24px,5vw,80px);padding:clamp(20px,4vw,56px)}
#player{display:flex;flex-direction:column;justify-content:center;gap:28px;min-width:0}
.brand{font-weight:700;letter-spacing:-.03em;font-size:18px;position:absolute;top:clamp(20px,3vw,40px);left:clamp(20px,4vw,56px)}
#art{width:100%;aspect-ratio:1;background:#111;object-fit:cover;display:block;border-radius:4px;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;box-shadow:0 30px 80px rgba(255,255,255,.06)}
#art.swap{transform:scale(.96);opacity:0}
#art.playing{transform:scale(1)}
#art.paused{transform:scale(.93)}
.meta{min-width:0}
#title{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{color:var(--mid);margin-top:6px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
#fill{height:100%;background:var(--fg);transform-origin:left;transform:scaleX(0);will-change:transform}
.times{display:flex;justify-content:space-between;color:var(--mid);font-size:12px;font-variant-numeric:tabular-nums;margin-top:10px}
.tools{display:flex;align-items:center;gap:10px;color:var(--mid);font-size:12px}
.tools button{padding:6px 12px;font-size:12px;border-color:var(--line)}
#off{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#lyrics{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#track{position:absolute;left:0;right:0;top:0;will-change:transform;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.l{font-size:clamp(26px,3.6vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.12;padding:.34em 0;opacity:.18;filter:blur(1.5px);transform:scale(.94);transform-origin:left center;transition:opacity .35s,filter .35s,transform .45s cubic-bezier(.22,1,.36,1);overflow-wrap:anywhere}
.l.n{opacity:.38;filter:blur(.6px)}
.l.a{opacity:1;filter:none;transform:scale(1)}
.l.p{opacity:.5;filter:none;transform:scale(.97)}
#note{position:absolute;inset:0;display:flex;align-items:center;font-size:clamp(22px,3vw,40px);font-weight:700;letter-spacing:-.03em;color:var(--mid);pointer-events:none;transition:opacity .3s}
#idle{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--mid);text-align:center;background:var(--bg);z-index:3;font-size:18px;padding:24px}
@media (max-width:820px){
#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:20px;padding:64px 20px 20px}
#player{flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px 16px}
#art{width:84px;height:84px;box-shadow:none}
.meta{flex:1}
#title{font-size:20px}
.bar,.times,.tools{flex-basis:100%}
.times{margin-top:6px}
.tools{display:none}
}
@media (prefers-reduced-motion:reduce){#track,.l,#art{transition:none}}
</style>
</head>
<body>
<div id="login">
<h1>Synchrony</h1>
<p>Live lyrics for whatever you’re playing on Spotify.</p>
<button id="connect">Connect Spotify</button>
</div>
<div id="app">
<div class="brand">Synchrony</div>
<section id="player">
<img id="art" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
<div class="meta"><div id="title">Nothing playing</div><div id="artist">Press play in Spotify</div></div>
<div style="width:100%"><div class="bar"><div id="fill"></div></div><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
<div class="tools"><span>Sync</span><button id="minus" aria-label="Earlier">−50</button><span id="off">0 ms</span><button id="plus" aria-label="Later">+50</button></div>
</section>
<section id="lyrics"><div id="idle">Open Spotify and play a song.</div><div id="note"></div><div id="track"></div></section>
</div>
<script>
const CLIENT_ID="a199a4190b6542aa8ea7605253c9b931";
const REDIRECT=location.origin+location.pathname;
const SCOPE="user-read-currently-playing user-read-playback-state";
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const rand=n=>b64(crypto.getRandomValues(new Uint8Array(n)));

async function login(){
const verifier=rand(64);
const challenge=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
store.set("sy_v",verifier);
const p=new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,scope:SCOPE,code_challenge_method:"S256",code_challenge:challenge});
location.href="https://accounts.spotify.com/authorize?"+p;
}

async function tokenRequest(body){
const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body)});
if(!r.ok)throw new Error("token");
const d=await r.json();
store.set("sy_at",d.access_token);
store.set("sy_exp",String(Date.now()+d.expires_in*1000-30000));
if(d.refresh_token)store.set("sy_rt",d.refresh_token);
return d.access_token;
}

async function token(){
const at=store.get("sy_at");
if(at&&Date.now()<Number(store.get("sy_exp")))return at;
const rt=store.get("sy_rt");
if(!rt)return null;
try{return await tokenRequest({grant_type:"refresh_token",refresh_token:rt,client_id:CLIENT_ID})}catch(e){["sy_at","sy_exp","sy_rt"].forEach(store.del);return null}
}

function showApp(){$("login").style.display="none";$("app").style.display="grid"}
function showLogin(){$("app").style.display="none";$("login").style.display="flex"}

let offset=Number(store.get("sy_off"))||0;
function setOffset(v){offset=v;store.set("sy_off",String(v));$("off").textContent=(v>0?"+":"")+v+" ms"}
setOffset(offset);
$("minus").onclick=()=>setOffset(offset-50);
$("plus").onclick=()=>setOffset(offset+50);
$("connect").onclick=login;

let cur={id:null,dur:0,playing:false,pos:0,at:0};
let lines=[],els=[],active=-2,synced=false,endPolled=false,lastSec=-1;
const cache=new Map();
const trackEl=$("track"),lyr=$("lyrics"),note=$("note");

const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

function parseLRC(t){
const out=[];
for(const raw of t.split("\n")){
const m=raw.match(/^((?:\[\d+:\d+(?:[.:]\d+)?\])+)\s*(.*)$/);
if(!m)continue;
const text=m[2].trim();
for(const tm of m[1].matchAll(/\[(\d+):(\d+)(?:[.:](\d+))?\]/g)){
const frac=tm[3]?Number("0."+tm[3]):0;
out.push({t:(Number(tm[1])*60+Number(tm[2])+frac)*1000,s:text});
}
}
return out.sort((a,b)=>a.t-b.t);
}

async function fetchLyrics(tr){
const key=tr.id;
if(cache.has(key))return cache.get(key);
const artist=tr.artists[0].name,name=tr.name,album=tr.album.name,dur=Math.round(tr.duration_ms/1000);
const q=new URLSearchParams({artist_name:artist,track_name:name,album_name:album,duration:dur});
let data=null;
try{
let r=await fetch("https://lrclib.net/api/get?"+q);
if(r.ok)data=await r.json();
if(!data||(!data.syncedLyrics&&!data.plainLyrics&&!data.instrumental)){
const s=await fetch("https://lrclib.net/api/search?"+new URLSearchParams({artist_name:artist,track_name:name}));
if(s.ok){
const arr=await s.json();
const best=arr.filter(x=>x.syncedLyrics).sort((a,b)=>Math.abs(a.duration-dur)-Math.abs(b.duration-dur))[0]||arr.find(x=>x.plainLyrics);
if(best&&(!best.duration||Math.abs(best.duration-dur)<6||!data))data=best;
}
}
}catch(e){}
cache.set(key,data);
return data;
}

function build(list,isSynced){
trackEl.textContent="";
els=list.map(x=>{const d=document.createElement("div");d.className="l";d.textContent=x.s||"♪";trackEl.appendChild(d);return d});
lines=list;synced=isSynced;active=-2;
trackEl.style.transition="none";
trackEl.style.transform="translateY("+(lyr.clientHeight*.4)+"px)";
void trackEl.offsetWidth;
trackEl.style.transition="";
}

function setNote(t){note.textContent=t;note.style.opacity=t?1:0}

async function loadTrack(tr){
build([],false);
setNote("");
const data=await fetchLyrics(tr);
if(cur.id!==tr.id)return;
if(!data){setNote("No lyrics found for this song.");return}
if(data.instrumental){setNote("Instrumental");return}
if(data.syncedLyrics){
const l=parseLRC(data.syncedLyrics);
if(l.length){build(l,true);return}
}
if(data.plainLyrics){
build(data.plainLyrics.split("\n").map(s=>({t:0,s:s.trim()})),false);
els.forEach(e=>{e.style.opacity=".7";e.style.filter="none";e.style.transform="none"});
trackEl.style.transform="translateY(0)";
return;
}
setNote("No lyrics found for this song.");
}

function pos(){return cur.playing?cur.pos+(performance.now()-cur.at):cur.pos}

function findIndex(t){
let lo=0,hi=lines.length-1,r=-1;
while(lo<=hi){const m=(lo+hi)>>1;if(lines[m].t<=t){r=m;lo=m+1}else hi=m-1}
return r;
}

function center(i){
const el=els[i];
if(!el)return;
const y=lyr.clientHeight*.4-(el.offsetTop+el.offsetHeight/2);
trackEl.style.transform="translateY("+y+"px)";
}

function setActive(i){
const prev=active;
active=i;
for(let k=Math.max(0,Math.min(prev,i)-3);k<=Math.min(els.length-1,Math.max(prev,i)+3);k++){
const d=k-i;
els[k].className="l"+(d===0?" a":d===1?" n":d<0&&d>=-1?" p":"");
}
if(i>=0)center(i);
}

function frame(){
if(synced&&els.length){
const t=pos()+offset;
const i=findIndex(t);
if(i!==active)setActive(i);
}
if(cur.id){
const p=Math.min(pos(),cur.dur);
$("fill").style.transform="scaleX("+(cur.dur?p/cur.dur:0)+")";
const s=Math.floor(p/1000);
if(s!==lastSec){lastSec=s;$("cur").textContent=fmt(p)}
if(cur.playing&&!endPolled&&cur.dur&&p>=cur.dur-30){endPolled=true;setTimeout(poll,120)}
}
requestAnimationFrame(frame);
}

function applyState(d,t0,t1){
const idle=$("idle");
if(!d||!d.item||d.currently_playing_type==="ad"){
idle.style.display="flex";
cur.playing=false;
return;
}
idle.style.display="none";
const tr=d.item;
const anchor=d.progress_ms+(t1-t0)/2;
const now=performance.now();
if(tr.id!==cur.id){
cur={id:tr.id,dur:tr.duration_ms,playing:d.is_playing,pos:anchor,at:now};
endPolled=false;
$("title").textContent=tr.name;
$("artist").textContent=tr.artists.map(a=>a.name).join(", ");
$("dur").textContent=fmt(tr.duration_ms);
document.title=tr.name+" · Synchrony";
const art=$("art"),src=(tr.album.images[0]||{}).url;
art.classList.add("swap");
setTimeout(()=>{if(src)art.src=src;art.classList.remove("swap")},200);
loadTrack(tr);
}else{
const predicted=cur.playing?cur.pos+(now-cur.at):cur.pos;
const diff=anchor-predicted;
if(!d.is_playing||!cur.playing||Math.abs(diff)>250){cur.pos=anchor;cur.at=now}
else{cur.pos=predicted+diff*.25;cur.at=now}
cur.playing=d.is_playing;
if(cur.dur-anchor>400)endPolled=false;
}
$("art").classList.toggle("playing",cur.playing);
$("art").classList.toggle("paused",!cur.playing);
}

let polling=false,timer=null;
async function poll(){
if(polling)return;
polling=true;
clearTimeout(timer);
let wait=1000;
try{
const at=await token();
if(!at){showLogin();polling=false;return}
const t0=performance.now();
const r=await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=track",{headers:{Authorization:"Bearer "+at},cache:"no-store"});
const t1=performance.now();
if(r.status===204)applyState(null);
else if(r.status===429)wait=(Number(r.headers.get("Retry-After"))||5)*1000;
else if(r.status===401){store.del("sy_at");store.del("sy_exp");wait=200}
else if(r.ok)applyState(await r.json(),t0,t1);
else wait=3000;
}catch(e){wait=2000}
polling=false;
timer=setTimeout(poll,wait);
}

document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
window.addEventListener("resize",()=>{if(active>=0)center(active)});

(async function init(){
const params=new URLSearchParams(location.search);
if(params.get("code")){
const v=store.get("sy_v");
history.replaceState({},"",REDIRECT);
if(v){
try{await tokenRequest({grant_type:"authorization_code",code:params.get("code"),redirect_uri:REDIRECT,client_id:CLIENT_ID,code_verifier:v})}catch(e){}
store.del("sy_v");
}
}else if(params.get("error")){history.replaceState({},"",REDIRECT)}
if(await token()){showApp();requestAnimationFrame(frame);poll()}
else showLogin();
})();
</script>
</body>
</html>
